# Generates Teach Me explanations for the official question bank and opens a
# pull request with them. Run it from the Actions tab → "Generate Teach Me
# explanations" → Run workflow. Needs the ANTHROPIC_API_KEY repository secret.
name: Generate Teach Me explanations

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Trial run: only generate this many (leave blank for all missing)'
        required: false
        default: ''
      subject:
        description: 'Only this subject, e.g. english (leave blank for all)'
        required: false
        default: ''
      force:
        description: 'Regenerate ALL explanations, not just missing ones'
        type: boolean
        default: false
      batch_id:
        description: 'Only if a previous run timed out: its batch id'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency: explanations

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: tools/explanations
        run: npm ci

      - name: Generate explanations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_SUBJECT: ${{ inputs.subject }}
          IN_FORCE: ${{ inputs.force }}
          IN_BATCH: ${{ inputs.batch_id }}
        run: |
          args=()
          [ -n "$IN_LIMIT" ] && args+=(--limit "$IN_LIMIT")
          [ -n "$IN_SUBJECT" ] && args+=(--subject "$IN_SUBJECT")
          [ "$IN_FORCE" = "true" ] && args+=(--force)
          [ -n "$IN_BATCH" ] && args+=(--resume "$IN_BATCH")
          node tools/explanations/generate.mjs "${args[@]}"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: explanations/update
          add-paths: |
            explanations/*.json
            tools/explanations/answer-check.json
          commit-message: Update pre-generated Teach Me explanations
          title: Update pre-generated Teach Me explanations
          body: |
            Generated by the "Generate Teach Me explanations" workflow.

            - Explanations: `explanations/<subject>.json`
            - Questions where the model disagrees with the marked answer: `tools/explanations/answer-check.json` — check these against the source papers before merging.

            Spot-check a sample of explanations before merging.
