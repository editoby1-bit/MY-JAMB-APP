<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathematics Batch 8 — Old vs New</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#152b42;font:16px/1.65 system-ui,Arial}header{background:#10243c;color:white;padding:18px 5%}header h1{margin:0;font-size:1.35rem}header p{margin:4px 0 0;color:#c6d8ee}.wrap{max-width:1250px;margin:auto;padding:18px}nav{background:white;border:1px solid #d3dfeb;border-radius:12px;padding:14px;margin-bottom:18px}select{width:100%;padding:13px;font:inherit;border:1px solid #9fb5c9;border-radius:8px}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{min-width:0;background:white;border:1px solid #d9e2ee;border-radius:14px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere}.panel h2{margin:0 0 12px;font-size:1.15rem}.new .example{white-space:normal;background:#eef8f1;border:1px solid #c9dfd0;border-radius:10px;margin:16px 0;overflow:hidden}.question{background:#e9f1ff;padding:12px;font-weight:700}.solution{padding:12px;white-space:pre-wrap}.solution strong{display:block;margin-bottom:6px;color:#216544}.new .diagram{white-space:normal;margin:18px 0}.new .diagram svg{max-width:100%;height:auto}.ordinary{white-space:pre-wrap}.panel h3{margin:0 0 10px}@media(max-width:760px){main{grid-template-columns:1fr}.panel{padding:14px}.wrap{padding:10px}}</style></head><body><header><h1>Mathematics — Batch 8 comparison</h1><p>Lessons 22–24 · old and revised lessons side by side · standalone preview</p></header><div class="wrap"><nav><label for="lesson"><strong>Select Batch 8 lesson</strong></label><select id="lesson"></select><p id="status"></p></nav><main><section class="panel"><h2>Original lesson</h2><div id="old"></div></section><section class="panel new"><h2>Revised lesson</h2><div id="new"></div></section></main></div><script>const DATA={"arr":[{"id":"applications-differentiation","revised":true,"old":{"title":"Applications of differentiation: rates, maxima and minima","body":"This syllabus objective did not previously have a dedicated Mathematics lesson."},"new":{"title":"Applications of differentiation: rates, maxima and minima","body":"APPLICATIONS OF DIFFERENTIATION — COMPLETE JAMB LESSON\n\nWHAT YOU WILL LEARN\nApply derivatives to gradient, tangent and normal, motion, increasing and decreasing functions, turning points, optimisation, related rates and simple economic applications. A derivative is a rate, not the original quantity.\n\n1. GRADIENT AS A RATE OF CHANGE\nFor y=f(x), dy/dx is the tangent gradient at x. A positive derivative means increasing locally, negative means decreasing. Evaluate the derivative at the specified x, not the original function.\n[LESSON_DIAGRAM:appdiff-gradient]\n\nExample (i): Find the gradient of y=2x³−5x at x=2.\nSolution\ndy/dx=6x²−5. At x=2, 6(4)−5=19.\nAnswer: 19.\n\nExample (ii): Find where y=x²−4x+7 has zero gradient.\nSolution\ndy/dx=2x−4. Set 2x−4=0; 2x=4.\nAnswer: x=2.\n\nExample (iii): Determine whether y=x³+2x is increasing for real x.\nSolution\nDerivative=3x²+2. Since x²≥0, 3x²+2>0 for every real x.\nAnswer: Increasing everywhere.\n\n2. EQUATIONS OF TANGENTS AND NORMALS\nAt x=a, point P=(a,f(a)). Tangent slope m=f′(a); tangent equation y−f(a)=m(x−a). The normal slope is −1/m when m≠0. A horizontal tangent has a vertical normal.\n[LESSON_DIAGRAM:appdiff-tangent]\n\nExample (iv): Find tangent to y=x²+1 at x=2.\nSolution\nPoint=(2,5). Derivative 2x gives slope 4. y−5=4(x−2), so y=4x−3.\nAnswer: y=4x−3.\n\nExample (v): Find normal to y=x² at x=2.\nSolution\nPoint=(2,4), tangent slope 4, normal slope −1/4. y−4=−(x−2)/4.\nAnswer: y=−x/4+9/2.\n\nExample (vi): Find tangent to y=x³−3x at x=1.\nSolution\nPoint=(1,−2). Derivative=3x²−3, giving slope 0. Tangent is horizontal.\nAnswer: y=−2.\n\n3. STATIONARY POINTS AND THEIR NATURE\nA stationary point satisfies f′(x)=0. Evaluate y to locate the point. If f″(x)>0 there is a local minimum; if f″(x)\u003c0 a local maximum. When f″=0, use sign change of f′; it is inconclusive by itself.\n[LESSON_DIAGRAM:appdiff-stationary]\n\nExample (vii): Find the turning point of y=x²−8x+13.\nSolution\nDerivative 2x−8=0 gives x=4. y=16−32+13=−3. Second derivative 2>0.\nAnswer: Minimum at (4,−3).\n\nExample (viii): Find the maximum of y=−2x²+12x−5.\nSolution\nDerivative −4x+12=0 gives x=3. y=−18+36−5=13. Second derivative −4\u003c0.\nAnswer: Maximum 13 at x=3.\n\nExample (ix): Classify the stationary point of y=x³ at x=0.\nSolution\nDerivative 3x²=0 at x=0; second derivative 6x=0 there. But derivative 3x² is positive on both sides, so no maximum or minimum.\nAnswer: Stationary point of inflection at (0,0).\n\n4. INTERVALS OF INCREASE AND DECREASE\nFactor f′(x), mark its zeros on a number line, and test the sign in each interval. Do not assume every derivative zero is a maximum or minimum.\n[LESSON_DIAGRAM:appdiff-sign]\n\nExample (x): Find increasing intervals of f(x)=x³−3x.\nSolution\nf′(x)=3x²−3=3(x−1)(x+1). Positive for x\u003c−1 or x>1; negative between −1 and 1.\nAnswer: Increasing on (−∞,−1) and (1,∞).\n\nExample (xi): For y=x²−6x, where is the curve decreasing?\nSolution\ndy/dx=2x−6. It is negative when 2x−6\u003c0, or x\u003c3.\nAnswer: x\u003c3.\n\n5. MAXIMUM AREA AND MINIMUM PERIMETER\nWrite the quantity to optimise in ONE variable using the constraint. Differentiate, set to zero, and confirm the extremum with the second derivative or endpoints. Include appropriate units.\n[LESSON_DIAGRAM:appdiff-rectangle]\n\nExample (xii): A rectangle has perimeter 40 m. Find dimensions for maximum area.\nSolution\nLet sides x and y. 2x+2y=40, so y=20−x. Area A=x(20−x)=20x−x². A′=20−2x=0 gives x=10; y=10. A″=−2\u003c0.\nAnswer: 10 m by 10 m; maximum area 100 m².\n\nExample (xiii): Two positive numbers sum to 18. Find their maximum product.\nSolution\nLet x and 18−x. P=18x−x². P′=18−2x=0 gives x=9. P″=−2\u003c0.\nAnswer: Maximum product 81, from 9 and 9.\n\nExample (xiv): A rectangular enclosure has area 144 m². Find minimum perimeter.\nSolution\nLet width x and length 144/x. P=2x+288/x. P′=2−288/x²=0 gives x²=144, x=12 (positive). Length 12; P″=576/x³>0.\nAnswer: Minimum perimeter 48 m.\n\n6. MOTION: DISPLACEMENT, VELOCITY AND ACCELERATION\nIf displacement is s(t), velocity v=ds/dt and acceleration a=d²s/dt². Negative velocity means motion in the negative direction, not negative speed. At a change of direction, velocity may pass through zero.\n[LESSON_DIAGRAM:appdiff-motion]\n\nExample (xv): For s=t³−6t²+9t, find velocity and acceleration at t=2.\nSolution\nv=3t²−12t+9, so v(2)=12−24+9=−3. a=6t−12, so a(2)=0.\nAnswer: Velocity −3 m/s; acceleration 0 m/s².\n\nExample (xvi): For s=5t²+2t, find velocity at t=3.\nSolution\nv=ds/dt=10t+2. Substitute t=3: 30+2.\nAnswer: 32 m/s.\n\nExample (xvii): A particle has v=4t−12. When is it instantaneously at rest?\nSolution\nSet v=0: 4t−12=0, so t=3.\nAnswer: t=3 s.\n\n7. RELATED RATES AND CHAIN RULE\nWhen y depends on x and x depends on t, dy/dt=(dy/dx)(dx/dt). Differentiate the relationship first, then substitute the instant's values. Keep rate units.\n[LESSON_DIAGRAM:appdiff-rates]\n\nExample (xviii): Radius of a circle grows at 3 cm/s. Find dA/dt at r=4 cm.\nSolution\nA=πr², dA/dr=2πr. dA/dt=2πr(dr/dt)=2π(4)(3).\nAnswer: 24π cm²/s.\n\nExample (xix): A cube's side grows at 2 cm/s. Find dV/dt when side=5 cm.\nSolution\nV=x³, so dV/dt=3x²(dx/dt)=3(25)(2).\nAnswer: 150 cm³/s.\n\nExample (xx): A sphere's radius increases at 1 cm/s. Find volume rate at r=3 cm.\nSolution\nV=(4/3)πr³, so dV/dt=4πr²(dr/dt)=4π(9)(1).\nAnswer: 36π cm³/s.\n\n8. SIMPLE ECONOMIC APPLICATIONS\nMarginal cost is dC/dq and marginal revenue is dR/dq. Profit P=R−C. An interior maximum profit occurs where P′=0, equivalently MR=MC, subject to a maximum check and feasible quantity.\n\nExample (xxi): Revenue R(q)=30q−q² and cost C(q)=6q+20. Find profit-maximising q.\nSolution\nP=24q−q²−20. P′=24−2q=0 gives q=12. P″=−2\u003c0.\nAnswer: 12 units.\n\nExample (xxii): If C(q)=q²+5q+100, find marginal cost at q=4.\nSolution\nMC=dC/dq=2q+5. At q=4, MC=8+5.\nAnswer: 13 cost units per item.\n\nExample (xxiii): For P(q)=−q²+10q−9, find maximum profit.\nSolution\nP′=−2q+10=0 gives q=5. P(5)=−25+50−9=16. P″=−2\u003c0.\nAnswer: 16 units of profit.\n\nCOMMON JAMB TRAPS\n• Confusing a zero derivative with an automatic maximum.\n• Forgetting the second derivative or endpoint checks.\n• Using f(a) instead of f′(a) for tangent gradient.\n• Giving a normal the same gradient as its tangent.\n• Forgetting to express a constrained quantity in one variable.\n• Confusing negative velocity with negative speed.\n\nPRACTISE AND CHECK\n(i) Find slope of y=4x² at x=3.\n(ii) Find stationary x of y=x²−10x.\n(iii) Find maximum of −x²+6x.\n(iv) If s=2t³, find acceleration.\n(v) Find normal gradient to a tangent of slope 5.\n(vi) Circle radius grows 1 cm/s; area rate at r=2.\n(vii) Two positive numbers sum 10. Maximum product?\n(viii) For C=3q²+2q, find marginal cost.\n\nANSWERS WITH REASONS\n(i) dy/dx=8x, so slope=24.\n(ii) 2x−10=0 gives x=5.\n(iii) x=3 gives maximum 9.\n(iv) v=6t², a=12t.\n(v) −1/5.\n(vi) 2πr×1=4π cm²/s.\n(vii) 5×5=25.\n(viii) dC/dq=6q+2.\n\nFINAL UNDERSTANDING CHECK\nExplain the method, units, assumptions and reason for each formula before calculating."}},{"id":"integration","revised":true,"old":{"title":"Integration","body":"Integration reverses differentiation.\n\nPower rule: ∫ x^{n} dx = x^{n+1}/(n + 1) + C (n ≠ −1). ∫ 1/x dx = ln x + C.\nStandard results: ∫ sin x dx = −cos x + C; ∫ cos x dx = sin x + C; ∫ e^{x} dx = e^{x} + C.\nWith ax inside: ∫ sin 3x dx = −⅓ cos 3x + C (divide by the coefficient of x).\n\nDefinite integrals: ∫_{a}^{b} f(x) dx = F(b) − F(a). No + C is needed.\n• ∫_{0}^{2} 3x^{2} dx = [x^{3}] from 0 to 2 = 8.\n\nArea under a curve between x = a and x = b = ∫_{a}^{b} y dx. A region below the x-axis gives a negative value; take its size.\n\nFinding y from dy/dx: integrate, then use the given point to find C.\n\nCommon traps:\n• Dividing by n instead of n + 1.\n• Forgetting the minus sign in ∫ sin x dx = −cos x.\n\nMemory tip: to check an integral, differentiate your answer; you should get back the original."},"new":{"title":"Integration","body":"INTEGRATION — COMPLETE JAMB MATHEMATICS LESSON\n\nWHAT YOU WILL LEARN\nReverse differentiation, evaluate indefinite and definite integrals, determine constants from initial conditions, calculate signed areas and physical areas, and apply integration to displacement and velocity. Always distinguish +C from definite bounds.\n\n1. INTEGRATION AS REVERSE DIFFERENTIATION\nIf F′(x)=f(x), then ∫f(x)dx=F(x)+C. The constant C represents all antiderivatives differing by a constant. Always check by differentiating the result.\n[LESSON_DIAGRAM:integration-reverse]\n\nExample (i): Integrate 6x² with respect to x.\nSolution\nIncrease power 2 to 3, divide by new power: ∫6x²dx=6x³/3+C.\nAnswer: 2x³+C.\n\nExample (ii): Find ∫(4x³−6x+7)dx.\nSolution\nIntegrate termwise: 4x⁴/4−6x²/2+7x+C.\nAnswer: x⁴−3x²+7x+C.\n\nExample (iii): Find ∫5 dx.\nSolution\nA constant 5 integrates to 5x; its derivative is 5.\nAnswer: 5x+C.\n\n2. POWER RULE AND EXCEPTIONS\nFor n≠−1, ∫xⁿdx=xⁿ⁺¹/(n+1)+C. For n=−1, ∫(1/x)dx=ln|x|+C, x≠0. Fractional and negative powers obey the same power rule except n=−1.\n[LESSON_DIAGRAM:integration-power]\n\nExample (iv): Evaluate ∫(3√x+2/x²)dx.\nSolution\nRewrite 3x¹ᐟ²+2x⁻². Integrate: 3×(2/3)x³ᐟ²+2×(x⁻¹/−1)+C.\nAnswer: 2x³ᐟ²−2/x+C.\n\nExample (v): Evaluate ∫(1/x)dx for x≠0.\nSolution\nThe power rule would divide by zero at n=−1; use the logarithm rule.\nAnswer: ln|x|+C.\n\nExample (vi): Integrate 8x⁻³.\nSolution\nIncrease exponent −3 to −2, divide by −2: 8x⁻²/(−2).\nAnswer: −4/x²+C.\n\n3. LINEAR SUBSTITUTION\nFor ∫[g(x)]ⁿg′(x)dx, let u=g(x). Then du=g′(x)dx and integrate uⁿ. For (ax+b)ⁿ, divide by a(n+1) after increasing the exponent. For n=−1 use a logarithm.\n[LESSON_DIAGRAM:integration-substitution]\n\nExample (vii): Evaluate ∫(2x+3)⁴dx.\nSolution\nLet u=2x+3, du=2dx, dx=du/2. Integral=(1/2)u⁵/5+C.\nAnswer: (2x+3)⁵/10+C.\n\nExample (viii): Evaluate ∫6x(x²+1)²dx.\nSolution\nLet u=x²+1, du=2x dx. Then 6x dx=3du. Integral=3∫u²du=u³+C.\nAnswer: (x²+1)³+C.\n\nExample (ix): Evaluate ∫3/(3x+2)dx.\nSolution\nLet u=3x+2, du=3dx. Integral ∫du/u.\nAnswer: ln|3x+2|+C.\n\n4. STANDARD TRIGONOMETRIC, EXPONENTIAL AND LOGARITHMIC INTEGRALS\nFor radian x: ∫sin x dx=−cos x+C, ∫cos x dx=sin x+C, ∫sec²x dx=tan x+C. Also ∫eˣdx=eˣ+C, ∫1/x dx=ln|x|+C. Divide by the inner coefficient for linear arguments.\n\nExample (x): Find ∫cos(3x)dx.\nSolution\nDerivative of sin(3x) is 3cos(3x); divide by 3.\nAnswer: (1/3)sin(3x)+C.\n\nExample (xi): Find ∫2e²ˣdx.\nSolution\nDerivative of e²ˣ is 2e²ˣ, matching the integrand.\nAnswer: e²ˣ+C.\n\nExample (xii): Find ∫sin(5x)dx.\nSolution\nDerivative of cos(5x) is −5sin(5x). Correct sign and factor.\nAnswer: −cos(5x)/5+C.\n\n5. DEFINITE INTEGRALS AND FUNDAMENTAL THEOREM\nIf F′(x)=f(x), then ∫ from a to b f(x)dx=F(b)−F(a). Do not add +C to a numerical definite integral. Reversing bounds reverses the sign. Integral from a to a equals zero.\n[LESSON_DIAGRAM:integration-definite]\n\nExample (xiii): Evaluate ∫ from 0 to 2 of 3x² dx.\nSolution\nAntiderivative F=x³. F(2)−F(0)=8−0.\nAnswer: 8.\n\nExample (xiv): Evaluate ∫ from 1 to 3 of (2x+1) dx.\nSolution\nF=x²+x. F(3)=9+3=12; F(1)=1+1=2. Difference=10.\nAnswer: 10.\n\nExample (xv): Evaluate ∫ from 2 to 0 of x dx.\nSolution\nF=x²/2. F(0)−F(2)=0−2.\nAnswer: −2.\n\n6. AREA UNDER A CURVE\nA definite integral is SIGNED area. Regions above the x-axis contribute positively; below contribute negatively. For total geometric area, split at x-axis crossings and add absolute values.\n[LESSON_DIAGRAM:integration-area]\n\nExample (xvi): Find area under y=x from x=0 to x=4.\nSolution\ny≥0 on interval. Area=∫₀⁴ x dx=[x²/2]₀⁴=16/2.\nAnswer: 8 square units.\n\nExample (xvii): Find total area between y=x−2 and x-axis from x=0 to x=4.\nSolution\nCurve crosses x-axis at x=2. Left triangle area=½×2×2=2; right triangle area=2. Or split integrals and take absolute values.\nAnswer: 4 square units.\n\nExample (xviii): Find area bounded by y=4−x² and x-axis.\nSolution\nIntersections: 4−x²=0 gives x=−2,2. Area=∫₋₂²(4−x²)dx=[4x−x³/3]₋₂²=(8−8/3)−(−8+8/3).\nAnswer: 32/3 square units.\n\n7. AREA BETWEEN TWO CURVES\nIf upper curve U(x)≥lower curve L(x) throughout [a,b], area=∫ₐᵇ[U(x)−L(x)]dx. Find intersection limits first when not supplied; split intervals if curves cross.\n[LESSON_DIAGRAM:integration-between]\n\nExample (xix): Find area between y=2x and y=x² for 0≤x≤2.\nSolution\n2x−x²=x(2−x)≥0 on [0,2]. Area=∫₀²(2x−x²)dx=[x²−x³/3]₀²=4−8/3.\nAnswer: 4/3 square units.\n\nExample (xx): Find area between y=3 and y=x for x from 0 to 3.\nSolution\nUpper=3, lower=x. Area=∫₀³(3−x)dx=[3x−x²/2]₀³=9−9/2.\nAnswer: 9/2 square units.\n\n8. INITIAL CONDITIONS AND FINDING FUNCTIONS\nWhen dy/dx is known, integrate to find y=F(x)+C. Use a stated point or initial value to determine C. Without a condition, leave C.\n\nExample (xxi): Given dy/dx=6x−4 and y=5 at x=1, find y.\nSolution\nIntegrate: y=3x²−4x+C. At x=1, 5=3−4+C, so C=6.\nAnswer: y=3x²−4x+6.\n\nExample (xxii): Given f′(x)=2x+3 and f(0)=7, find f(2).\nSolution\nIntegrate f=x²+3x+C. At x=0, C=7. f(2)=4+6+7.\nAnswer: 17.\n\n9. DISPLACEMENT FROM VELOCITY\nDisplacement between times a and b equals ∫ₐᵇv(t)dt. Negative velocity contributes negative displacement; total DISTANCE is ∫ₐᵇ|v(t)|dt, splitting at velocity zeros.\n[LESSON_DIAGRAM:integration-motion]\n\nExample (xxiii): A particle moves with v(t)=2t+1 m/s. Find displacement from t=0 to 3.\nSolution\n∫₀³(2t+1)dt=[t²+t]₀³=9+3.\nAnswer: 12 m.\n\nExample (xxiv): Velocity v=t−2 m/s for 0≤t≤4. Find total distance.\nSolution\nVelocity changes sign at t=2. Distance=|∫₀²(t−2)dt|+∫₂⁴(t−2)dt=2+2.\nAnswer: 4 m.\n\nExample (xxv): Given acceleration a(t)=6t and v(0)=4, find v(t).\nSolution\nIntegrate dv/dt=6t: v=3t²+C. Initial v(0)=4 gives C=4.\nAnswer: v(t)=3t²+4.\n\nCOMMON JAMB TRAPS\n• Forgetting +C in an indefinite integral.\n• Adding +C to a definite numerical answer.\n• Using power rule for x⁻¹ instead of logarithm.\n• Failing to divide by inner derivative in linear substitution.\n• Confusing signed integral with total physical area.\n• Forgetting upper minus lower curve.\n\nPRACTISE AND CHECK\n(i) ∫4x³dx?\n(ii) ∫x⁻²dx?\n(iii) ∫(3x+1)²dx?\n(iv) ∫₀² x dx?\n(v) ∫₁² 2x dx?\n(vi) ∫sin x dx?\n(vii) Area under y=2 from x=1 to x=5?\n(viii) If f′=4x and f(1)=3, find f(x).\n\nANSWERS WITH REASONS\n(i) x⁴+C.\n(ii) −1/x+C.\n(iii) (3x+1)³/9+C.\n(iv) [x²/2]₀²=2.\n(v) [x²]₁²=3.\n(vi) −cos x+C.\n(vii) 2(5−1)=8 square units.\n(viii) f=2x²+C; C=1; f=2x²+1.\n\nFINAL UNDERSTANDING CHECK\nExplain the method, units, assumptions and reason for each formula before calculating."}},{"id":"representation-data","revised":true,"old":{"title":"Representation of data: tables, histograms, bar and pie charts","body":"This syllabus objective did not previously have a dedicated Mathematics lesson."},"new":{"title":"Representation of data: tables, histograms, bar and pie charts","body":"REPRESENTATION OF DATA: TABLES, HISTOGRAMS, BAR AND PIE CHARTS — COMPLETE JAMB LESSON\n\nWHAT YOU WILL LEARN\nOrganise raw data, build frequency and cumulative-frequency tables, choose appropriate bar charts, histograms and pie charts, calculate frequency densities and angles, interpret misleading axes, and solve exam-style problems from tables and diagrams. Accurate labelling is as important as arithmetic.\n\n1. DATA TYPES AND FREQUENCY TABLES\nQualitative data describe categories (e.g., subjects). Quantitative data are numbers: discrete counts or continuous measurements. A frequency is the number of occurrences. A frequency table must account for every observation exactly once. Relative frequency=f/total; percentage=100f/total.\n[LESSON_DIAGRAM:data-frequency]\n\nExample (i): Data: 2,3,2,4,3,2,5. Construct frequencies.\nSolution\nCount each distinct value: 2 occurs three times, 3 twice, 4 once, 5 once. Total 3+2+1+1=7.\nAnswer: 2→3, 3→2, 4→1, 5→1.\n\nExample (ii): A class has 12 boys and 18 girls. Find girls' relative frequency.\nSolution\nTotal=12+18=30. Relative frequency=18/30=0.6.\nAnswer: 0.6, or 60%.\n\nExample (iii): A survey counts 8,12,15,5 students in four categories. Find total sample size.\nSolution\nAdd all frequencies: 8+12+15+5=40.\nAnswer: 40 students.\n\n2. GROUPED DATA AND CLASS BOUNDARIES\nContinuous data can be grouped into adjacent intervals, such as 0≤x\u003c10, 10≤x\u003c20. Use non-overlapping boundaries. Class width=upper boundary−lower boundary. Midpoint=(lower+upper)/2. Grouping loses exact individual values.\n[LESSON_DIAGRAM:data-grouped]\n\nExample (iv): Find midpoint and width of 20≤x\u003c30.\nSolution\nMidpoint=(20+30)/2=25. Width=30−20=10.\nAnswer: Midpoint 25; width 10.\n\nExample (v): A table has classes 0–9,10–19,20–29 for integer scores. State continuous class boundaries.\nSolution\nFor whole-number recorded scores, adjacent continuous boundaries are −0.5–9.5, 9.5–19.5, 19.5–29.5.\nAnswer: −0.5–9.5; 9.5–19.5; 19.5–29.5.\n\n3. BAR CHARTS AND MULTIPLE BAR CHARTS\nBar charts compare separate categories. Bars normally have EQUAL width with GAPS between them. The height represents frequency (or stated percentage), with a clear vertical scale. A multiple bar chart groups bars for two or more comparable series.\n[LESSON_DIAGRAM:data-bars]\n\nExample (vi): A bar chart gives frequencies A=8, B=12, C=5. Which category is most common?\nSolution\nCompare bar heights on the same vertical scale. B has the largest frequency, 12.\nAnswer: B.\n\nExample (vii): Category A has 10 of 40 responses. Find percentage bar height on a 0–100% scale.\nSolution\nPercentage=10/40×100=25%.\nAnswer: 25%.\n\nExample (viii): Sales of 20,30,50 units are plotted. What total do the bars represent?\nSolution\nAdd category counts 20+30+50.\nAnswer: 100 units.\n\n4. HISTOGRAMS AND FREQUENCY DENSITY\nHistograms represent grouped continuous data. Bars TOUCH because intervals are adjacent. When class widths differ, bar HEIGHT must be frequency density=f/class width; bar AREA then represents frequency. With equal widths, frequency heights are proportional to frequencies.\n[LESSON_DIAGRAM:data-histogram]\n\nExample (ix): Classes 0–10,10–20,20–30 have frequencies 5,10,15. Find histogram densities.\nSolution\nEach width=10. Densities: 5/10=0.5; 10/10=1; 15/10=1.5.\nAnswer: 0.5, 1, 1.5.\n\nExample (x): Class 0–5 has frequency 10; class 5–15 has frequency 10. Compare histogram bar heights.\nSolution\nFirst width 5, density 10/5=2. Second width 10, density 10/10=1.\nAnswer: First bar twice as tall.\n\nExample (xi): A histogram bar spans width 8 and has frequency density 3. Find frequency.\nSolution\nFrequency=bar area=width×density=8×3.\nAnswer: 24.\n\n5. PIE CHARTS AND SECTOR ANGLES\nA pie chart partitions a full circle of 360°. Sector angle=(category frequency/total frequency)×360°. Conversely frequency=(sector angle/360°)×total. All sectors must sum to 360°. If one sector angle is missing, subtract known angles from 360°; do not invent an unspecified angle.\n[LESSON_DIAGRAM:data-pie]\n\nExample (xii): A survey of 60 students records 20 choosing Mathematics. Find the sector angle.\nSolution\nAngle=(20/60)×360°=(1/3)×360°.\nAnswer: 120°.\n\nExample (xiii): A pie chart has sectors 90°,120°,60° and x°. Find x.\nSolution\nFull circle=360°. Known angles=90+120+60=270°. x=360−270.\nAnswer: 90°.\n\nExample (xiv): A 72° pie sector represents 15 students. Find total surveyed.\nSolution\n72/360=15/N. N=15×360/72=75.\nAnswer: 75 students.\n\nExample (xv): A sector of 108° represents a category. What percentage is it?\nSolution\nPercentage=(108/360)×100=30%.\nAnswer: 30%.\n\n6. LINE GRAPHS AND TIME SERIES\nA line graph shows change over an ordered variable such as time. Plot each (time,value) point accurately and connect in order when appropriate. The slope between readings gives average rate of change; do not assume a trend continues indefinitely.\n[LESSON_DIAGRAM:data-line]\n\nExample (xvi): Temperature rises from 20°C at 9 am to 26°C at 12 noon. Find average hourly rise.\nSolution\nChange=26−20=6°C over 3 hours. Rate=6/3.\nAnswer: 2°C per hour.\n\nExample (xvii): A line graph records 5,8,7,12 across four days. Between which consecutive days is increase greatest?\nSolution\nChanges: +3,−1,+5. Greatest positive change is +5 from day 3 to day 4.\nAnswer: Day 3 to day 4.\n\n7. CUMULATIVE FREQUENCY AND OGIVES\nCumulative frequency adds successive frequencies up to a class boundary. Plot cumulative totals against UPPER class boundaries and join smoothly for an ogive. The final cumulative frequency equals the sample size. Read median at N/2 on the cumulative-frequency axis.\n[LESSON_DIAGRAM:data-ogive]\n\nExample (xviii): Classes 0–10,10–20,20–30 have frequencies 4,7,9. Find cumulative frequencies.\nSolution\nFirst total 4; next 4+7=11; final 11+9=20.\nAnswer: 4,11,20.\n\nExample (xix): A cumulative-frequency graph ends at 80. At value 25 it reads 30. How many observations exceed 25?\nSolution\nTotal 80; number at or below 25 is 30 (as read). Above 25=80−30.\nAnswer: 50.\n\nExample (xx): For 100 observations, which cumulative frequency locates the median?\nSolution\nThe median is at the halfway cumulative position N/2=100/2.\nAnswer: 50.\n\n8. READING AND CHECKING STATISTICAL DISPLAYS\nInspect axis origins, equal intervals, units, bar widths, category labels and totals. A truncated axis can exaggerate differences. A frequency polygon connects points at class midpoints; it is not a bar chart. Do not infer exact individual values from grouped data.\n[LESSON_DIAGRAM:data-axis]\n\nExample (xxi): A bar chart starts its vertical axis at 90 rather than zero and shows 95 and 100. Why might it mislead?\nSolution\nThe apparent height difference is exaggerated relative to the actual difference of 5 units. A zero baseline is generally appropriate for bar lengths.\nAnswer: Truncated axis exaggerates the comparison.\n\nExample (xxii): A table has frequencies 6,9,5 and a pie chart with sector angles 108°,162°,90°. Check consistency.\nSolution\nTotal=20. Angles: 6/20×360=108°, 9/20×360=162°, 5/20×360=90°. Sum=360°.\nAnswer: Consistent.\n\nExample (xxiii): A frequency table totals 48, but a pie chart's sectors total 350°. Is the chart complete?\nSolution\nAll pie sectors must total 360°. The displayed angles are 10° short.\nAnswer: No; 10° of sectors is missing.\n\nCOMMON JAMB TRAPS\n• Using bar-chart gaps for a continuous histogram.\n• Using raw frequency as histogram height when class widths are unequal.\n• Confusing sector angle with percentage.\n• Assigning a missing pie-chart category an invented value.\n• Using the class upper LIMIT instead of the stated class BOUNDARY without checking convention.\n• Treating a truncated vertical axis as a fair comparison of bar lengths.\n• Assuming exact individual observations can be recovered from grouped frequencies.\n\nPRACTISE AND CHECK\n(i) Frequency of 4 in 4,5,4,6,4?\n(ii) Relative frequency of 12 out of 30?\n(iii) Pie angle for 25 of 100?\n(iv) Frequency represented by 144° sector of total 50?\n(v) Histogram density for frequency 24, width 6?\n(vi) Frequency for histogram density 2, width 7?\n(vii) Cumulative frequencies for 3,5,7?\n(viii) Missing pie angle when others sum 275°?\n\nANSWERS WITH REASONS\n(i) 3.\n(ii) 12/30=0.4.\n(iii) 25/100×360=90°.\n(iv) 144/360×50=20.\n(v) 24/6=4.\n(vi) 2×7=14.\n(vii) 3,8,15.\n(viii) 360−275=85°.\n\nFINAL UNDERSTANDING CHECK\nExplain the method, units, assumptions and reason for each formula before calculating."}}],"diagrams":{"appdiff-gradient":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Gradient of tangent\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Gradient of tangent\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3. lns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M45 210L485 210\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M60 245L60 25\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M80 195Q155 25 250 195 M255 65Q355 245 450 65\" fill=\"none\" stroke=\"#286da0\" stroke-width=\"3\"/>\u003ctext x=\"105\" y=\"35\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">maximum\u003c/text>\u003ctext x=\"340\" y=\"247\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">minimum\u003c/text>\u003c/svg>\u003cp>At a stationary point f′=0; use f″ or sign changes to classify.\u003c/p>\u003c/div>","appdiff-sign":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Derivative sign chart\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Derivative sign chart\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M55 130L470 130\" stroke=\"#286da0\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M160 120L160 140\" stroke=\"#b45309\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M350 120L350 140\" stroke=\"#b45309\" stroke-width=\"3\" fill=\"none\"/>\u003ctext x=\"90\" y=\"100\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">f′ > 0\u003c/text>\u003ctext x=\"230\" y=\"100\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">f′ \u003c 0\u003c/text>\u003ctext x=\"385\" y=\"100\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">f′ > 0\u003c/text>\u003ctext x=\"115\" y=\"180\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">−1\u003c/text>\u003ctext x=\"340\" y=\"180\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">1\u003c/text>\u003ctext x=\"100\" y=\"225\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Increasing → decreasing → increasing\u003c/text>\u003c/svg>\u003cp>The signs shown illustrate f′(x)=3(x+1)(x−1).\u003c/p>\u003c/div>","appdiff-rectangle":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Rectangle with fixed perimeter\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Rectangle with fixed perimeter\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"130\" y=\"40\" width=\"260\" height=\"165\" fill=\"#eaf3ff\" stroke=\"#286da0\" stroke-width=\"3\"/>\u003ctext x=\"230\" y=\"28\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">x\u003c/text>\u003ctext x=\"395\" y=\"130\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">y\u003c/text>\u003ctext x=\"110\" y=\"245\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">P=2(x+y); Area=xy\u003c/text>\u003c/svg>\u003cp>Express y in terms of x before differentiating area.\u003c/p>\u003c/div>","appdiff-motion":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Displacement, velocity, acceleration\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Displacement, velocity, acceleration\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"40\" y=\"45\" width=\"440\" height=\"75\" rx=\"8\" fill=\"#eaf3ff\" stroke=\"#286da0\"/>\u003ctext x=\"95\" y=\"92\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"20\">s(t) → v(t)=s′(t) → a(t)=v′(t)\u003c/text>\u003ctext x=\"90\" y=\"180\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Units: m → m/s → m/s²\u003c/text>\u003c/svg>\u003cp>Differentiate displacement once for velocity and twice for acceleration.\u003c/p>\u003c/div>","appdiff-rates":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Related rates: circle area\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Related rates: circle area\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003ccircle cx=\"190\" cy=\"130\" r=\"85\" fill=\"#eaf3ff\" stroke=\"#286da0\" stroke-width=\"3\"/>\u003cpath d=\"M190 130L275 130\" stroke=\"#286da0\" stroke-width=\"3\" fill=\"none\"/>\u003ctext x=\"228\" y=\"118\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">r\u003c/text>\u003ctext x=\"310\" y=\"95\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">A = πr²\u003c/text>\u003ctext x=\"310\" y=\"145\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">dA/dt =\u003c/text>\u003ctext x=\"310\" y=\"175\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">2πr × dr/dt\u003c/text>\u003c/svg>\u003cp>A changing radius changes area at a rate depending on the current radius.\u003c/p>\u003c/div>","integration-reverse":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Differentiation and integration\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Differentiation and integration\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"30\" y=\"80\" width=\"170\" height=\"80\" rx=\"8\" fill=\"#eaf3ff\" stroke=\"#286da0\"/>\u003ctext x=\"82\" y=\"125\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"22\">F(x)\u003c/text>\u003crect x=\"320\" y=\"80\" width=\"170\" height=\"80\" rx=\"8\" fill=\"#f0f8eb\" stroke=\"#22805b\"/>\u003ctext x=\"377\" y=\"125\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"22\">f(x)\u003c/text>\u003cpath d=\"M210 100L305 100\" stroke=\"#286da0\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M305 143L210 143\" stroke=\"#22805b\" stroke-width=\"3\" fill=\"none\"/>\u003ctext x=\"210\" y=\"82\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"13\">differentiate\u003c/text>\u003ctext x=\"225\" y=\"175\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"13\">integrate + C\u003c/text>\u003c/svg>\u003cp>Integration reverses differentiation up to an arbitrary constant.\u003c/p>\u003c/div>","integration-power":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Power rule for integration\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Power rule for integration\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"35\" y=\"45\" width=\"450\" height=\"82\" rx=\"9\" fill=\"#eaf3ff\" stroke=\"#286da0\"/>\u003ctext x=\"90\" y=\"93\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"23\">∫xⁿ dx = xⁿ⁺¹/(n+1) + C\u003c/text>\u003ctext x=\"85\" y=\"180\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Valid for n ≠ −1\u003c/text>\u003ctext x=\"85\" y=\"218\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">For n=−1: ∫1/x dx = ln|x| + C\u003c/text>\u003c/svg>\u003cp>Increase the exponent by one, then divide by the new exponent.\u003c/p>\u003c/div>","integration-substitution":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Substitution u = g(x)\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Substitution u = g(x)\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003crect x=\"35\" y=\"45\" width=\"450\" height=\"85\" rx=\"9\" fill=\"#eaf3ff\" stroke=\"#286da0\"/>\u003ctext x=\"90\" y=\"90\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"22\">u = g(x); du = g′(x)dx\u003c/text>\u003ctext x=\"85\" y=\"180\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">∫[g(x)]ⁿ g′(x)dx = ∫uⁿdu\u003c/text>\u003c/svg>\u003cp>Substitution reverses the chain rule.\u003c/p>\u003c/div>","integration-definite":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Definite integral: upper minus lower\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Definite integral: upper minus lower\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M45 210L485 210\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M60 245L60 25\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M90 190Q240 150 425 60\" fill=\"none\" stroke=\"#286da0\" stroke-width=\"3\"/>\u003ctext x=\"150\" y=\"245\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">a\u003c/text>\u003ctext x=\"370\" y=\"245\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">b\u003c/text>\u003ctext x=\"190\" y=\"45\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">∫ₐᵇ f(x)dx = F(b) − F(a)\u003c/text>\u003c/svg>\u003cp>Evaluate an antiderivative at the upper limit and subtract its value at the lower limit.\u003c/p>\u003c/div>","integration-area":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Area under a positive curve\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Area under a positive curve\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M45 210L485 210\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M60 245L60 25\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M110 210L110 155Q230 90 390 55L390 210Z\" fill=\"#d9ebfa\" stroke=\"none\"/>\u003cpath d=\"M110 155Q230 90 390 55\" fill=\"none\" stroke=\"#286da0\" stroke-width=\"3\"/>\u003ctext x=\"100\" y=\"238\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">a\u003c/text>\u003ctext x=\"385\" y=\"238\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">b\u003c/text>\u003ctext x=\"200\" y=\"150\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Area\u003c/text>\u003c/svg>\u003cp>When the curve is above the x-axis, the definite integral gives the geometric area.\u003c/p>\u003c/div>","integration-between":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Area between two curves\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Area between two curves\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M45 210L485 210\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M60 245L60 25\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M110 180Q250 40 400 180Q250 225 110 180Z\" fill=\"#d9ebfa\" stroke=\"none\"/>\u003cpath d=\"M110 180Q250 40 400 180 M110 180Q250 225 400 180\" fill=\"none\" stroke=\"#286da0\" stroke-width=\"3\"/>\u003ctext x=\"210\" y=\"110\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Upper U(x)\u003c/text>\u003ctext x=\"210\" y=\"208\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Lower L(x)\u003c/text>\u003c/svg>\u003cp>Area is the integral of upper minus lower between intersection limits.\u003c/p>\u003c/div>","integration-motion":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Velocity graph and signed displacement\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Velocity graph and signed displacement\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M45 210L485 210\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M60 245L60 25\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M80 245L440 65\" fill=\"none\" stroke=\"#286da0\" stroke-width=\"3\"/>\u003ctext x=\"160\" y=\"115\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Negative velocity\u003c/text>\u003ctext x=\"320\" y=\"105\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Positive velocity\u003c/text>\u003ctext x=\"230\" y=\"245\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">time\u003c/text>\u003c/svg>\u003cp>Total distance uses absolute velocity; signed displacement can cancel.\u003c/p>\u003c/div>","data-frequency":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Frequency table: discrete observations\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Frequency table: discrete observations\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003cg font-family=\"sans-serif\" font-size=\"19\" fill=\"#17324c\">\u003crect x=\"90\" y=\"12\" width=\"170\" height=\"48\" fill=\"#d9eafa\" stroke=\"#9eb5c8\"/>\u003ctext x=\"155\" y=\"43\">Value\u003c/text>\u003crect x=\"260\" y=\"12\" width=\"170\" height=\"48\" fill=\"#d9eafa\" stroke=\"#9eb5c8\"/>\u003ctext x=\"325\" y=\"43\">Frequency\u003c/text>\u003crect x=\"90\" y=\"60\" width=\"170\" height=\"48\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"155\" y=\"91\">2\u003c/text>\u003crect x=\"260\" y=\"60\" width=\"170\" height=\"48\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"325\" y=\"91\">3\u003c/text>\u003crect x=\"90\" y=\"108\" width=\"170\" height=\"48\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"155\" y=\"139\">3\u003c/text>\u003crect x=\"260\" y=\"108\" width=\"170\" height=\"48\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"325\" y=\"139\">2\u003c/text>\u003crect x=\"90\" y=\"156\" width=\"170\" height=\"48\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"155\" y=\"187\">4\u003c/text>\u003crect x=\"260\" y=\"156\" width=\"170\" height=\"48\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"325\" y=\"187\">1\u003c/text>\u003crect x=\"90\" y=\"204\" width=\"170\" height=\"48\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"155\" y=\"235\">5\u003c/text>\u003crect x=\"260\" y=\"204\" width=\"170\" height=\"48\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"325\" y=\"235\">1\u003c/text>\u003c/g>\u003c/svg>\u003cp>Each observation is counted exactly once; the frequencies sum to 7.\u003c/p>\u003c/div>","data-grouped":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Grouped classes and midpoints\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Grouped classes and midpoints\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003cg font-family=\"sans-serif\" font-size=\"17\" fill=\"#17324c\">\u003crect x=\"50\" y=\"30\" width=\"140\" height=\"52\" fill=\"#d9eafa\" stroke=\"#9eb5c8\"/>\u003ctext x=\"78\" y=\"62\">Interval\u003c/text>\u003crect x=\"190\" y=\"30\" width=\"140\" height=\"52\" fill=\"#d9eafa\" stroke=\"#9eb5c8\"/>\u003ctext x=\"218\" y=\"62\">Width\u003c/text>\u003crect x=\"330\" y=\"30\" width=\"140\" height=\"52\" fill=\"#d9eafa\" stroke=\"#9eb5c8\"/>\u003ctext x=\"358\" y=\"62\">Midpoint\u003c/text>\u003crect x=\"50\" y=\"82\" width=\"140\" height=\"52\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"78\" y=\"114\">0–10\u003c/text>\u003crect x=\"190\" y=\"82\" width=\"140\" height=\"52\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"218\" y=\"114\">10\u003c/text>\u003crect x=\"330\" y=\"82\" width=\"140\" height=\"52\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"358\" y=\"114\">5\u003c/text>\u003crect x=\"50\" y=\"134\" width=\"140\" height=\"52\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"78\" y=\"166\">10–20\u003c/text>\u003crect x=\"190\" y=\"134\" width=\"140\" height=\"52\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"218\" y=\"166\">10\u003c/text>\u003crect x=\"330\" y=\"134\" width=\"140\" height=\"52\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"358\" y=\"166\">15\u003c/text>\u003crect x=\"50\" y=\"186\" width=\"140\" height=\"52\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"78\" y=\"218\">20–30\u003c/text>\u003crect x=\"190\" y=\"186\" width=\"140\" height=\"52\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"218\" y=\"218\">10\u003c/text>\u003crect x=\"330\" y=\"186\" width=\"140\" height=\"52\" fill=\"#f5fafc\" stroke=\"#9eb5c8\"/>\u003ctext x=\"358\" y=\"218\">25\u003c/text>\u003c/g>\u003c/svg>\u003cp>Intervals are adjacent without overlap; midpoint is the average of the boundaries.\u003c/p>\u003c/div>","data-bars":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Bar chart: separate categories\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Bar chart: separate categories\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M45 210L485 210\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M60 245L60 25\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003crect x=\"80\" y=\"120\" width=\"60\" height=\"90\" fill=\"#91bce0\" stroke=\"#286da0\"/>\u003ctext x=\"103\" y=\"233\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">A\u003c/text>\u003crect x=\"180\" y=\"75\" width=\"60\" height=\"135\" fill=\"#91bce0\" stroke=\"#286da0\"/>\u003ctext x=\"203\" y=\"233\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">B\u003c/text>\u003crect x=\"280\" y=\"150\" width=\"60\" height=\"60\" fill=\"#91bce0\" stroke=\"#286da0\"/>\u003ctext x=\"303\" y=\"233\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">C\u003c/text>\u003ctext x=\"85\" y=\"45\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Frequency\u003c/text>\u003c/svg>\u003cp>Bar charts have equal-width bars with gaps for distinct categories.\u003c/p>\u003c/div>","data-histogram":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Histogram: unequal class widths\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Histogram: unequal class widths\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M45 210L485 210\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M60 245L60 25\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003crect x=\"80\" y=\"110\" width=\"85\" height=\"100\" fill=\"#a5c9e8\" stroke=\"#286da0\"/>\u003crect x=\"165\" y=\"160\" width=\"170\" height=\"50\" fill=\"#a5c9e8\" stroke=\"#286da0\"/>\u003crect x=\"335\" y=\"85\" width=\"85\" height=\"125\" fill=\"#a5c9e8\" stroke=\"#286da0\"/>\u003ctext x=\"75\" y=\"242\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">0\u003c/text>\u003ctext x=\"158\" y=\"242\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">5\u003c/text>\u003ctext x=\"325\" y=\"242\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">15\u003c/text>\u003ctext x=\"415\" y=\"242\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">20\u003c/text>\u003ctext x=\"80\" y=\"40\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Height = frequency ÷ class width\u003c/text>\u003c/svg>\u003cp>Adjacent bars touch. With unequal widths, AREA (not height) is proportional to frequency.\u003c/p>\u003c/div>","data-pie":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Pie chart: sector angle\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Pie chart: sector angle\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003ccircle cx=\"250\" cy=\"130\" r=\"102\" fill=\"#eaf3ff\" stroke=\"#286da0\" stroke-width=\"3\"/>\u003cpath d=\"M250 130L250 28A102 102 0 0 1 338.3 181Z\" fill=\"#b8dbf4\" stroke=\"#286da0\" stroke-width=\"2\"/>\u003ctext x=\"260\" y=\"95\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">120°\u003c/text>\u003ctext x=\"80\" y=\"255\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Angle = frequency/total × 360°\u003c/text>\u003c/svg>\u003cp>The illustrated 120° sector is one third of the circle; all sectors total 360°.\u003c/p>\u003c/div>","data-line":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Line graph: values over time\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Line graph: values over time\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M45 210L485 210\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M60 245L60 25\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpolyline points=\"100,165 195,105 290,125 385,55\" fill=\"none\" stroke=\"#286da0\" stroke-width=\"3\"/>\u003ccircle cx=\"100\" cy=\"165\" r=\"5\" fill=\"#b45309\"/>\u003ccircle cx=\"195\" cy=\"105\" r=\"5\" fill=\"#b45309\"/>\u003ccircle cx=\"290\" cy=\"125\" r=\"5\" fill=\"#b45309\"/>\u003ccircle cx=\"385\" cy=\"55\" r=\"5\" fill=\"#b45309\"/>\u003ctext x=\"210\" y=\"245\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Time →\u003c/text>\u003ctext x=\"75\" y=\"30\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Value\u003c/text>\u003c/svg>\u003cp>Connect ordered observations to show change over time.\u003c/p>\u003c/div>","data-ogive":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Cumulative frequency curve\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Cumulative frequency curve\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M45 210L485 210\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M60 245L60 25\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpolyline points=\"75,210 165,185 260,125 390,45\" fill=\"none\" stroke=\"#286da0\" stroke-width=\"3\"/>\u003ctext x=\"220\" y=\"245\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Upper class boundary →\u003c/text>\u003ctext x=\"80\" y=\"30\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Cumulative frequency\u003c/text>\u003c/svg>\u003cp>The last cumulative frequency equals the total number of observations.\u003c/p>\u003c/div>","data-axis":"\u003cdiv class=\"math-lesson-diagram\" style=\"margin:16px 0;padding:12px;background:#fff;border:1px solid #cbd9e8;border-radius:12px\">\u003ch4>Bar-chart axis integrity\u003c/h4>\u003csvg viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Bar-chart axis integrity\" style=\"width:100%;height:auto\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M45 210L485 210\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003cpath d=\"M60 245L60 25\" stroke=\"#64748b\" stroke-width=\"3\" fill=\"none\"/>\u003crect x=\"135\" y=\"100\" width=\"75\" height=\"110\" fill=\"#a5c9e8\" stroke=\"#286da0\"/>\u003crect x=\"275\" y=\"75\" width=\"75\" height=\"135\" fill=\"#a5c9e8\" stroke=\"#286da0\"/>\u003ctext x=\"125\" y=\"245\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Category A\u003c/text>\u003ctext x=\"275\" y=\"245\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Category B\u003c/text>\u003ctext x=\"80\" y=\"35\" fill=\"#17324c\" font-family=\"sans-serif\" font-size=\"16\">Scale starts at zero\u003c/text>\u003c/svg>\u003cp>A zero baseline helps bar lengths communicate relative magnitudes fairly.\u003c/p>\u003c/div>"}};const select=document.getElementById('lesson');DATA.arr.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+22)+'. '+x.new.title;select.appendChild(o)});function render(){const x=DATA.arr[+select.value||0];document.getElementById('status').textContent='Showing lesson '+(22+(+select.value||0))+' of 24 completed lessons';document.getElementById('old').textContent=x.old.body;const root=document.getElementById('new');root.replaceChildren();const tokens=x.new.body.split(/(\[LESSON_DIAGRAM:[^\]]+\])/g);for(const part of tokens){const match=part.match(/^\[LESSON_DIAGRAM:([^\]]+)\]$/);if(match){const div=document.createElement('div');div.className='diagram';div.innerHTML=DATA.diagrams[match[1]]||'';root.appendChild(div);continue}const chunks=part.split(/(?=^Example \([ivxlcdm]+\):)/gm);for(const chunk of chunks){const m=chunk.match(/^(Example \([ivxlcdm]+\):[^\n]*)\nSolution\n([\s\\S]*?)(?=\n\n|$)/);if(m){const box=document.createElement('div');box.className='example';const q=document.createElement('div');q.className='question';q.textContent=m[1];const sol=document.createElement('div');sol.className='solution';const strong=document.createElement('strong');strong.textContent='Solution';sol.appendChild(strong);sol.appendChild(document.createTextNode(m[2]));box.append(q,sol);root.appendChild(box);const tail=chunk.slice(m[0].length);if(tail){const t=document.createElement('div');t.className='ordinary';t.textContent=tail;root.appendChild(t)}}else{const div=document.createElement('div');div.className='ordinary';div.textContent=chunk;root.appendChild(div)}}}}select.addEventListener('change',render);render();</script></body></html>
