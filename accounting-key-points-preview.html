<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounting Key Points Preview</title><style>body{margin:0;background:#f2f5fa;color:#14233b;font:16px system-ui,sans-serif}header{background:#10223f;color:white;padding:22px}main{max-width:850px;margin:auto;padding:16px}.panel{background:white;border:1px solid #dbe3ec;border-radius:16px;padding:20px;margin:16px 0}select{width:100%;padding:14px;font:inherit;border-radius:10px;border:1px solid #b9c8da}pre{white-space:pre-wrap;font:inherit;line-height:1.75;overflow-wrap:anywhere}h1{font-size:24px}h2{font-size:21px}.note{background:#e9f5ed;padding:12px;border-radius:10px;color:#135a3d}</style></head><body><header><h1>Accounting · Key Points Preview</h1><p>19 lessons · First three expanded · Review before publishing</p></header><main><div class="panel"><label>Choose lesson<select id="sel"></select></label><p class="note">Dedicated Accounting review page. Remaining lessons will be expanded before approval.</p></div><article class="panel"><h2 id="title"></h2><pre id="body"></pre></article></main><script>const lessons=[{"id":"nature-concepts","title":"Nature of accounting, concepts and the accounting equation","body":"Bookkeeping is the recording of business transactions in a systematic way. Accounting goes further: it classifies, summarises, interprets and communicates the financial information so that people can make decisions. Bookkeeping is part of accounting.\n\nUsers of accounts and what they want:\n• Owners and shareholders: profit and the safety of their investment.\n• Managers: information for planning and control.\n• Creditors, banks and lenders: whether they will be paid.\n• Government and the tax authorities: tax and statistics.\n• Employees and trade unions: job security and pay.\n• Investors, analysts and the public.\n\nAccounting concepts (assumptions) and conventions JAMB tests:\n• Business entity: the business is separate from its owner, so the owner's private spending is drawings.\n• Going concern: the business will continue for the foreseeable future, so assets are shown at cost less depreciation, not break-up value.\n• Accruals (matching): income and expenses are recorded when earned or incurred, not when cash moves; expenses are matched with the revenue they earn.\n• Consistency: the same methods are used from year to year.\n• Prudence (conservatism): do not overstate profit or assets; provide for foreseeable losses but do not anticipate gains. Stock is valued at the lower of cost and net realisable value.\n• Historical cost: assets are recorded at what they cost.\n• Money measurement: only items that can be measured in money are recorded.\n• Dual aspect: every transaction has two effects (the basis of double entry).\n• Realisation: revenue is recognised when goods pass to the customer, not when cash is received.\n• Materiality: small items (a ₦500 stapler) need not be treated strictly as assets.\n• Periodicity: accounts are prepared for fixed periods, usually a year.\n• Objectivity: records are based on evidence such as source documents.\n\nQualities of useful information: relevance, reliability (faithful representation), comparability, understandability and timeliness.\n\nThe accounting equation:\nAssets = Capital + Liabilities\nCapital = Assets − Liabilities\nWorked example: Ada starts business with ₦400,000 cash (Assets ₦400,000 = Capital ₦400,000). She buys goods on credit for ₦100,000: Assets ₦500,000 = Capital ₦400,000 + Liabilities ₦100,000. She sells goods costing ₦40,000 for ₦60,000 cash: stock falls ₦40,000, cash rises ₦60,000, so Assets ₦520,000 = Capital ₦420,000 (profit ₦20,000) + Liabilities ₦100,000.\n\nICT in accounting: computerised packages (for example Sage, QuickBooks) record, post and produce reports quickly and accurately, but need controls such as passwords and back-ups.\nEthics: integrity, objectivity, confidentiality, professional competence. In Nigeria the professional bodies are ICAN (1965) and ANAN (1993).\n\nToday's terms: IFRS (adopted in Nigeria from 2012, overseen by the Financial Reporting Council of Nigeria, which replaced the Nigerian Accounting Standards Board in 2011) calls the balance sheet the \"statement of financial position\", stock \"inventory\", and capital \"equity\".\n\nCommon traps:\n• Mixing prudence (do not overstate) with consistency (same method).\n• Thinking revenue is recognised when cash is received; under realisation it is when the goods are delivered.\n• Writing Assets = Capital − Liabilities; the correct rearrangement is Capital = Assets − Liabilities.\n• Treating owner's private expenses as business expenses (the entity concept forbids it).\n\nDEEPER EXAM APPLICATION — ACCOUNTING EQUATION AND EQUITY\nUse Assets = Capital + Liabilities, or Capital = Assets − Liabilities. A business begins with ₦500,000 cash contributed by the owner and obtains a ₦200,000 bank loan. Assets ₦700,000 = Capital ₦500,000 + Liabilities ₦200,000. Buying equipment for ₦120,000 cash changes the composition of assets, not total assets or capital. Paying ₦50,000 to a creditor decreases both cash and liabilities by ₦50,000. Withdrawing ₦30,000 for private use decreases cash and capital by ₦30,000. Profit increases capital; loss and drawings reduce it. Never treat a loan as income or drawings as an expense of the business.\n\nCLASSIFY BEFORE CALCULATING\nAssets: cash, inventory, receivables, equipment. Liabilities: trade payables, bank loans, outstanding expenses. Equity: owner's capital plus retained profit less drawings. Revenue is income earned; expenses are costs incurred to earn revenue. A prepayment is an asset, whereas an accrual is a liability. A customer owing the business is a receivable (asset); a supplier owed by the business is a payable (liability).\n\nJAMB-STYLE CHECK\nIf assets are ₦950,000 and liabilities are ₦370,000, capital is ₦580,000. If the owner then introduces ₦80,000 cash, assets and capital each rise by ₦80,000. If the owner withdraws ₦20,000, both fall by ₦20,000. Check that the equation balances after each event. Do not subtract liabilities from capital to calculate assets.\n\nCONCEPTS IN CONTRAST\nAccrual means record transactions when earned or incurred; matching allocates related costs to the period's revenue. Prudence avoids overstating assets or profits; consistency means applying methods comparably over time. Materiality asks whether an omission could affect a user's decision. Historical cost begins with the amount paid for an asset. Going concern assumes continued operation; business entity separates the proprietor from the firm. In questions, identify the exact behaviour described rather than choosing a concept merely because it sounds familiar."},{"id":"source-documents","title":"Source documents and books of original entry","body":"Every entry in the books must be supported by evidence. That evidence is a source document.\n\nMain source documents:\n• Invoice: issued by the seller for a credit sale; the buyer's copy supports a credit purchase.\n• Receipt: proof that cash was received.\n• Credit note: sent by the seller to the buyer to reduce the amount owed, for goods returned or an overcharge.\n• Debit note: sent by the buyer to the seller asking for a credit (for example for goods returned).\n• Cheque counterfoil (stub): evidence of a payment by cheque.\n• Paying-in slip (deposit slip): evidence of money paid into the bank.\n• Petty cash voucher: evidence of a small cash payment.\n• Bank statement: the bank's record of the account.\n• Other documents that are not accounting entries in themselves: quotation, order, delivery note, pro-forma invoice (sent before goods are supplied, often for payment in advance) and statement of account (a monthly summary sent to a customer).\n\nBooks of original entry (also called books of prime entry, journals or day books): transactions are first written here, then posted to the ledger.\n• Sales day book (sales journal): credit sales of goods, from copies of sales invoices.\n• Purchases day book: credit purchases of goods, from invoices received.\n• Returns inwards (sales returns) day book: goods returned by customers, from credit notes sent.\n• Returns outwards (purchases returns) day book: goods returned to suppliers, from credit notes received (or debit notes sent).\n• Cash book: all cash and bank receipts and payments (it is both a book of original entry and a ledger account).\n• Petty cash book: small cash payments.\n• Journal proper (general journal): everything else: opening entries, credit purchase or sale of fixed assets, correction of errors, transfers, and year-end adjustments such as depreciation and bad debts written off.\n\nFormat of a journal entry:\nDate | Particulars | Folio | Dr ₦ | Cr ₦\n1 Jan  Motor van account Dr ........ 900,000\n       To Ade Motors .................... 900,000\n       (Being motor van bought on credit)\nEach journal entry has a debit, a credit and a narration explaining it.\n\nThe accounting cycle:\nSource document → Book of original entry → Ledger → Trial balance → Final accounts\n\nTrade discount is a reduction given to trade buyers; it is deducted on the invoice and never entered in the ledger. Cash discount is given for prompt payment and is recorded in the cash book.\n\nWorked example: goods listed at ₦80,000, trade discount 25%. Invoice value = ₦80,000 − ₦20,000 = ₦60,000; the sales day book records ₦60,000.\n\nOnly credit sales of GOODS go to the sales day book. A credit sale of an old motor van goes to the journal; a cash sale goes to the cash book.\n\nCommon traps:\n• Mixing credit note and debit note: the credit note comes from the seller and reduces what the customer owes.\n• Recording trade discount in the ledger; only cash discount is recorded.\n• Entering credit purchase of a fixed asset in the purchases day book instead of the journal.\n• Calling the trial balance a book of original entry; it is a list drawn from the ledger.\n\nTRANSACTION-TO-RECORD WORKFLOW\nA customer orders goods → the seller may issue an invoice for a credit sale → the seller records it in the sales day book → the customer account is debited and sales credited in the ledger. When a customer returns goods, the seller issues a credit note and records sales returns (returns inwards). For goods returned to a supplier, the buyer normally issues a debit note; purchases returns are returns outwards. Receipts acknowledge payment; statements of account summarise transactions and outstanding balances but are not themselves the original sale.\n\nWORKED EXAMPLE — TRADE AND CASH DISCOUNTS\nList price ₦80,000 less 10% trade discount = invoice value ₦72,000. The trade discount of ₦8,000 is deducted before recording the invoice and is not posted as a separate ledger entry. If the customer receives a further 5% settlement discount on ₦72,000, the cash paid is ₦68,400 and discount allowed is ₦3,600. The seller debits cash ₦68,400 and discount allowed ₦3,600, then credits the customer's account ₦72,000. Do not calculate the 5% on the original ₦80,000.\n\nWHICH BOOK?\nCredit goods sold → sales day book; credit goods bought for resale → purchases day book; returns from customers → returns inwards book; goods sent back to suppliers → returns outwards book; cash or bank receipts and payments → cash book; transactions outside the specialised books, such as credit purchase of equipment → general journal. A cash sale belongs in the cash book, not the sales day book. The ledger is where entries are classified into accounts; the trial balance is prepared from ledger balances.\n\nEXAM TRAPS AND QUICK CHECK\nThe person who issues a credit note is typically the seller, not the buyer. A debit note is often the buyer's notice of a return, not proof that cash has been paid. A purchase invoice for inventory is different from an invoice for a non-current asset. Check whether the question asks for the document, the book of prime entry or the final ledger account: these are three different stages."},{"id":"double-entry","title":"The double-entry system and the ledger","body":"Double entry rests on the dual aspect concept: every transaction affects two accounts, one debited and one credited with the same amount. So total debits always equal total credits.\n\nThe ledger is the main book of accounts. Each account has a debit side (left) and a credit side (right). The ledger is usually divided into the sales (debtors') ledger, the purchases (creditors') ledger and the general (nominal) ledger. Cash and bank are kept in the cash book.\n\nClassification of accounts:\n• Personal accounts: people and firms (debtors, creditors, capital).\n• Real accounts: property (land, machinery, stock, cash).\n• Nominal accounts: income, expenses, gains and losses (rent, wages, sales, commission received).\n\nRules of double entry:\n• Debit an increase in an asset or an expense (and drawings).\n• Credit an increase in a liability, capital or income.\n• Decreases go on the opposite side.\nTraditional rule: \"debit the receiver, credit the giver\"; for real accounts, \"debit what comes in, credit what goes out\"; for nominal accounts, \"debit expenses and losses, credit income and gains\".\n\nCommon entries:\n• Owner brings in cash: Dr Cash, Cr Capital.\n• Credit purchase of goods: Dr Purchases, Cr Supplier (creditor).\n• Credit sale: Dr Customer (debtor), Cr Sales.\n• Paid rent by cheque: Dr Rent, Cr Bank.\n• Returns inwards: Dr Returns inwards, Cr Debtor.\n• Returns outwards: Dr Creditor, Cr Returns outwards.\n• Owner takes goods for own use: Dr Drawings, Cr Purchases.\n\nBalancing an account: add both sides; put the difference on the smaller side as \"Balance c/d\" so the totals agree, then bring it down on the opposite side as \"Balance b/d\". An account with more debits has a debit balance (assets, expenses, drawings); more credits gives a credit balance (liabilities, capital, income).\n\nWorked example: Bank account: debits ₦250,000 (capital) and ₦40,000 (sales); credits ₦120,000 (purchases) and ₦30,000 (rent).\nDebits total ₦290,000; credits ₦150,000.\nBalance c/d on the credit side = ₦290,000 − ₦150,000 = ₦140,000.\nBalance b/d ₦140,000 debit (money in the bank, an asset).\n\nStock accounts: purchases of goods for resale go to the purchases account, not to a stock account; the stock account is used only for opening and closing stock at the year end.\n\nCommon traps:\n• Debiting sales for a credit sale; sales (income) is always credited.\n• Debiting a fixed asset bought for use to purchases; it goes to its own asset account.\n• Bringing a balance down on the same side as \"c/d\"; b/d goes on the opposite side.\n• Thinking a credit balance on a customer's account is normal; a debtor normally has a debit balance.\n\nTHE DOUBLE-ENTRY DECISION RULE\nFirst identify the two accounts affected; then classify each as asset, liability, capital, income or expense. Increases in assets and expenses are debits. Increases in liabilities, capital and income are credits. Decreases go on the opposite side. Every complete transaction has equal total debit and credit entries. The mnemonic DEAD CLIC can help: Debit Expenses, Assets and Drawings; Credit Liabilities, Income and Capital.\n\nWORKED TRANSACTIONS\n1. Owner starts a business with ₦250,000 cash: Dr Cash ₦250,000; Cr Capital ₦250,000.\n2. Goods bought on credit for ₦45,000: Dr Purchases ₦45,000; Cr Supplier ₦45,000.\n3. Goods sold on credit for ₦70,000: Dr Customer ₦70,000; Cr Sales ₦70,000.\n4. Rent of ₦12,000 paid by bank: Dr Rent ₦12,000; Cr Bank ₦12,000.\n5. Customer pays ₦20,000 by bank transfer: Dr Bank ₦20,000; Cr Customer ₦20,000.\n6. Owner takes ₦5,000 cash for personal use: Dr Drawings ₦5,000; Cr Cash ₦5,000.\nNotice that purchases are normally goods for resale, not every item the business buys.\n\nLEDGER BALANCING EXAMPLE\nA cash account has ₦250,000 opening debit, ₦20,000 receipts and ₦12,000 rent plus ₦5,000 drawings paid. Closing cash is ₦253,000 debit (₦270,000 minus ₦17,000). The balancing figure is entered as balance c/d on the credit side to make both totals equal; it is brought down as balance b/d on the debit side of the next period. This is a bookkeeping presentation, not a new receipt or payment.\n\nJAMB APPLICATION\nFor a credit sale, debit the debtor and credit sales. For a cash sale, debit cash and credit sales. When a debtor pays, debit cash or bank and credit debtor; do not credit sales again. For a loan received, debit bank and credit loan payable, not capital or revenue. For depreciation, debit depreciation expense and credit accumulated depreciation. A balanced trial balance is useful but does not prove every transaction was recorded correctly."},{"id":"cash-book","title":"Cash book, discounts and petty cash","body":"The cash book records all cash and bank receipts (debit side) and payments (credit side). It is both a book of original entry and a ledger account.\n\nTypes:\n• Single-column cash book: cash only.\n• Two-column cash book: cash and bank columns (or cash and discount).\n• Three-column cash book: discount, cash and bank columns on each side.\n\nDiscounts:\n• Discount allowed: given to customers for prompt payment; it is in the debit-side discount column and is an expense (Dr Discount allowed, Cr Debtors).\n• Discount received: from suppliers; in the credit-side discount column; it is income (Dr Creditors, Cr Discount received).\n• The discount columns are memorandum columns: they are not balanced; their totals are posted to the discount accounts in the ledger.\n• Trade discount is never entered in the cash book.\n\nContra entries: money moving between the cash and bank columns of the same cash book. Paying office cash into the bank: Dr Bank column, Cr Cash column, marked \"C\". Withdrawing cash from the bank for office use: Dr Cash, Cr Bank.\n\nBalances: the cash column can only have a debit balance (you cannot hold less than nothing). The bank column may have a credit balance, which is a bank overdraft.\n\nWorked example: Obi owes ₦40,000 and pays by cheque, taking a 5% cash discount.\nDiscount allowed = 5% × ₦40,000 = ₦2,000\nCheque received = ₦40,000 − ₦2,000 = ₦38,000\nCash book debit side: discount ₦2,000, bank ₦38,000. Obi's account is credited with both, total ₦40,000, so he owes nothing.\n\nPetty cash and the imprest system:\nThe petty cash book records small payments (transport, postage, cleaning). Under the imprest system, the petty cashier receives a fixed float (the imprest). At the end of the period the main cashier reimburses exactly the amount spent, restoring the float.\nReimbursement = Imprest − Cash left in hand = Total of petty cash vouchers\nExample: imprest ₦30,000; vouchers total ₦21,750; cash left ₦8,250. Reimbursement = ₦21,750.\nThe petty cash book is analysed in columns (one per type of expense); the column totals are debited to the expense accounts. Advantages: control of small spending, saves the chief cashier's time, and cash plus vouchers can be checked against the imprest at any time.\n\nCommon traps:\n• Putting discount allowed on the credit side; it sits with receipts (debit).\n• Balancing the discount columns; they are only totalled.\n• Thinking a credit balance in the bank column is money in the bank; it is an overdraft (a current liability).\n• Reimbursing the imprest amount instead of the amount spent."},{"id":"bank-reconciliation","title":"Bank reconciliation statement","body":"The bank column of the cash book and the bank statement record the same account from opposite sides: money in the bank is a debit in the cash book but a credit balance on the bank statement (to the bank it is a liability to the customer). On any date the two balances usually differ.\n\nCauses of difference:\n1. Timing differences:\n• Unpresented cheques: cheques written and entered in the cash book but not yet presented at the bank.\n• Uncredited lodgements (deposits in transit): money paid in and entered in the cash book but not yet credited by the bank.\n2. Items on the statement not yet in the cash book:\n• Bank charges and commission, interest charged, standing orders and direct debits (reduce the balance).\n• Direct credits (credit transfers), dividends and interest received (increase the balance).\n• Dishonoured (returned) cheques (reduce the balance).\n3. Errors in the cash book or by the bank.\n\nSteps:\nStep 1: Update the cash book with items on the statement not yet entered (charges, standing orders, direct credits, dishonoured cheques, cash book errors). This gives the adjusted cash book balance.\nStep 2: Prepare the bank reconciliation statement for the remaining timing differences.\n\nFormat (starting from the adjusted cash book balance):\nBalance per cash book (adjusted) ...... X\nAdd: unpresented cheques .............. X\nLess: uncredited lodgements ........... (X)\nBalance per bank statement ............ X\nStarting from the bank statement, reverse the signs: add uncredited lodgements and deduct unpresented cheques to arrive at the cash book balance.\n\nWorked example: Cash book balance ₦85,000 (debit). The bank statement shows bank charges ₦2,000 and a direct credit of ₦12,000 not in the cash book. Unpresented cheques ₦30,000; uncredited lodgement ₦18,000.\nStep 1: Adjusted cash book = ₦85,000 − ₦2,000 + ₦12,000 = ₦95,000.\nStep 2: ₦95,000 + ₦30,000 − ₦18,000 = ₦107,000 per bank statement.\nCheck from the statement side: ₦107,000 − ₦30,000 + ₦18,000 = ₦95,000.\n\nOverdrafts: a credit balance in the cash book (a debit balance on the statement) is an overdraft. Treat it as a negative figure and the same rules work.\n\nPurposes: to explain the difference, to detect errors and fraud, to update the cash book, and to give the correct bank figure for the balance sheet (the adjusted cash book balance, not the statement balance).\n\nCommon traps:\n• Putting unpresented cheques into the cash book; they are already there. Only statement items go into the cash book.\n• Adding uncredited lodgements when starting from the cash book; they are deducted.\n• Forgetting that a debit balance in the cash book is a credit balance on the bank statement.\n• Using the bank statement figure in the balance sheet; use the adjusted cash book balance."},{"id":"trial-balance-errors","title":"Trial balance, errors and the suspense account","body":"A trial balance is a list of all the ledger balances (including cash and bank) on a given date, with debit balances in one column and credit balances in the other. If double entry has been done correctly, the two totals agree. It is a check on arithmetical accuracy and the starting point for the final accounts; it is not itself an account.\n\nDebit balances: assets, expenses, drawings, purchases, returns inwards, discount allowed, opening stock.\nCredit balances: capital, liabilities, sales, returns outwards, discount received, provisions (depreciation, doubtful debts), income received.\n\nErrors that do NOT affect the agreement of the trial balance:\n• Omission: a transaction left out completely.\n• Commission: correct amount, correct type of account, wrong person's account (₦5,000 from Bello posted to Bala's account).\n• Principle: the wrong class of account (repairs debited to the machinery account; a fixed asset debited to purchases).\n• Original entry: the wrong amount in the book of original entry, so both sides are wrong by the same amount.\n• Complete reversal: the correct accounts but the debit and credit sides swapped.\n• Compensating errors: two errors that cancel each other.\n\nErrors that DO affect the trial balance:\n• Single-sided entries (one side posted, the other not).\n• Different amounts on the two sides (including a transposition such as ₦369 posted as ₦396 in one account; the difference ₦27 is divisible by 9).\n• Both entries on the same side, or one entry on the wrong side.\n• Wrong addition (casting) of an account or a day book, or a wrong balance carried down.\n\nThe suspense account: when the totals disagree, the difference is put in a suspense account on the SHORT side so that the trial balance agrees and the final accounts can be drafted. As errors are found, journal entries correct them through suspense until it closes.\n\nWorked example: debit total ₦452,600; credit total ₦451,700. The credit side is short by ₦900, so suspense is credited ₦900. Errors found:\n(i) Sales day book undercast by ₦1,200: Dr Suspense ₦1,200, Cr Sales ₦1,200.\n(ii) Discount allowed ₦300 not posted to the discount allowed account: Dr Discount allowed ₦300, Cr Suspense ₦300.\nSuspense: credits ₦900 + ₦300 = ₦1,200; debit ₦1,200. Closed.\n\nCorrecting errors that do not touch suspense: an error of commission (₦5,000 from Bello credited to Bala) is corrected by Dr Bala ₦5,000, Cr Bello ₦5,000. A complete reversal is corrected by double the amount on each side.\n\nEffect on profit: an error that touches an income or expense account (for example sales undercast) changes net profit when corrected; an error between two balance sheet accounts does not.\n\nCommon traps:\n• Putting the suspense balance on the larger side; it goes on the smaller side.\n• Thinking an agreed trial balance means the books are free of errors.\n• Correcting a complete reversal with the single amount instead of twice the amount.\n• Calling an error of commission an error of principle; commission stays within the same class of account."},{"id":"final-accounts","title":"Final accounts of a sole trader, with adjustments","body":"Final accounts (financial statements) are prepared at the end of the year from the trial balance:\n• Trading account: finds gross profit.\n• Profit and loss account: finds net profit.\n• Balance sheet: shows assets, liabilities and capital at the year end.\nUnder IFRS these are the statement of profit or loss (income statement) and the statement of financial position; \"stock\" is called \"inventory\".\n\nFormats:\nNet sales = Sales − Returns inwards\nNet purchases = Purchases − Returns outwards + Carriage inwards\nCost of goods sold = Opening stock + Net purchases − Closing stock\nGross profit = Net sales − Cost of goods sold\nNet profit = Gross profit + Other income − Expenses\nClosing capital = Opening capital + Capital introduced + Net profit − Drawings\n\nTrading account items: sales, returns inwards, opening stock, purchases, returns outwards, carriage inwards, import duty, and direct (productive) wages.\nProfit and loss items: carriage outwards, rent, salaries, ordinary wages, insurance, discount allowed, bad debts, depreciation and interest; income such as discount received, rent received and commission received is added.\n\nAdjustments (accruals concept):\n• Accrued expense: add to the expense; show as a current liability.\n• Prepaid expense: deduct from the expense; show as a current asset.\n• Accrued income: add to the income; current asset.\n• Income received in advance: deduct; current liability.\n• Closing stock: credited in the trading account and shown as a current asset.\n\nWorked example:\nSales ₦600,000; returns inwards ₦20,000; opening stock ₦80,000; purchases ₦350,000; returns outwards ₦10,000; carriage inwards ₦5,000; closing stock ₦95,000.\nNet sales = ₦600,000 − ₦20,000 = ₦580,000\nNet purchases = ₦350,000 − ₦10,000 + ₦5,000 = ₦345,000\nCost of goods sold = ₦80,000 + ₦345,000 − ₦95,000 = ₦330,000\nGross profit = ₦580,000 − ₦330,000 = ₦250,000\nExpenses: rent paid ₦60,000 with ₦12,000 prepaid gives ₦48,000; wages paid ₦70,000 with ₦6,000 accrued gives ₦76,000; carriage outwards ₦8,000. Total ₦132,000.\nNet profit = ₦250,000 − ₦132,000 = ₦118,000\n\nBalance sheet layout (vertical):\nFixed (non-current) assets at cost less depreciation\n+ Current assets (stock, debtors, prepayments, bank, cash)\n− Current liabilities (creditors, accruals, overdraft)\n= Net assets, financed by: Capital + Net profit − Drawings, plus long-term liabilities.\nCurrent assets are listed in increasing order of liquidity in the traditional UK/Nigerian layout (stock first, cash last).\n\nCommon traps:\n• Putting carriage outwards in the trading account; only carriage inwards goes there.\n• Adding returns outwards to purchases; they are deducted.\n• Treating drawings as an expense.\n• Forgetting that a prepayment reduces the expense and appears as an asset.\n• Confusing period and date: the profit and loss account is \"for the year ended\"; the balance sheet is \"as at\"."},{"id":"depreciation-assets","title":"Capital and revenue expenditure, depreciation and disposal","body":"Capital expenditure buys, adds to or improves a fixed (non-current) asset, giving benefit for more than one year: buying land, machinery or vehicles, plus their installation, legal fees, carriage and first registration. It goes to the balance sheet.\nRevenue expenditure is spent on running the business: repairs, fuel, wages, insurance, rent. It goes to the profit and loss account.\nCapital receipts (sale of a fixed asset, a loan, new capital) are not income; revenue receipts (sales, rent received, commission) are.\n\nDepreciation is the part of the cost of a fixed asset used up in a period through wear and tear, use, passage of time or obsolescence. It applies the matching concept. Land is normally not depreciated.\n\nMethods:\n• Straight line (fixed instalment): Annual charge = (Cost − Residual value) ÷ Useful life.\n• Reducing balance (diminishing balance): a fixed percentage of the net book value each year, so the charge falls each year.\n• Others: revaluation (small tools, livestock), sum-of-the-years' digits, machine hours or units of output, and depletion (mines, quarries).\n\nWorked examples:\nStraight line: cost ₦800,000, residual value ₦80,000, life 4 years.\n(₦800,000 − ₦80,000) ÷ 4 = ₦180,000 each year.\nReducing balance at 20% on cost ₦500,000:\nYear 1: 20% × ₦500,000 = ₦100,000; NBV ₦400,000\nYear 2: 20% × ₦400,000 = ₦80,000; NBV ₦320,000\nYear 3: 20% × ₦320,000 = ₦64,000; NBV ₦256,000\n\nRecording (modern method): Dr Profit and loss (depreciation expense), Cr Provision for depreciation (accumulated depreciation). The asset stays at cost; the balance sheet shows Cost − Accumulated depreciation = Net book value.\n\nDisposal of a fixed asset (disposal account):\nDr Disposal, Cr Asset (cost)\nDr Provision for depreciation, Cr Disposal (accumulated depreciation)\nDr Bank, Cr Disposal (sale proceeds)\nThe balance on the disposal account is the profit (credit to P&L) or loss (debit to P&L).\nExample: machine cost ₦600,000; accumulated depreciation ₦360,000; sold for ₦200,000.\nNBV = ₦600,000 − ₦360,000 = ₦240,000\nLoss on disposal = ₦240,000 − ₦200,000 = ₦40,000\nPart exchange: the trade-in allowance is treated as the sale proceeds.\n\nUnder IFRS (IAS 16) fixed assets are \"property, plant and equipment\" and are shown as non-current assets.\n\nCommon traps:\n• Treating repairs as capital expenditure; only improvements and additions are capital.\n• Applying the reducing balance percentage to cost every year (that is straight line).\n• Forgetting to deduct residual value under straight line.\n• Thinking depreciation provides cash for replacement; it is only an allocation of cost.\n• Comparing proceeds with cost instead of with net book value to find the profit or loss on disposal."},{"id":"bad-debts-provisions","title":"Bad debts, provisions and reserves","body":"A bad debt is an amount owed by a debtor that will never be received (the customer is dead, bankrupt or cannot be traced). It is written off: Dr Bad debts, Cr Debtor. At the year end the bad debts account is transferred to the profit and loss account as an expense.\n\nA provision for doubtful debts (provision for bad debts) is an estimate of debts that may not be collected, usually a percentage of debtors after writing off bad debts. It applies prudence.\n• Create or increase: Dr Profit and loss, Cr Provision for doubtful debts (only the increase).\n• Decrease: Dr Provision, Cr Profit and loss (a gain).\n• Balance sheet: Debtors − Provision = net debtors.\n\nWorked example: debtors ₦210,000; bad debts to write off ₦10,000; provision required 5% of debtors; existing provision ₦6,000.\nDebtors after write-off = ₦210,000 − ₦10,000 = ₦200,000\nNew provision = 5% × ₦200,000 = ₦10,000\nIncrease charged to P&L = ₦10,000 − ₦6,000 = ₦4,000\nBad debts charged to P&L = ₦10,000\nBalance sheet: Debtors ₦200,000 − Provision ₦10,000 = ₦190,000\n\nBad debts recovered: when a written-off debt is later paid, reinstate the debtor (Dr Debtor, Cr Bad debts recovered), then record the cash (Dr Cash, Cr Debtor). Bad debts recovered is income in the profit and loss account.\n\nProvision for discount allowed: calculated on debtors after deducting the provision for doubtful debts. Using the example above at 2%: 2% × ₦190,000 = ₦3,800.\n\nProvisions and reserves:\n• A provision is a charge against profit for a known loss or liability whose amount is uncertain (depreciation, doubtful debts). It is made whether or not there is a profit.\n• A reserve is an appropriation (setting aside) of profit, not a charge against it.\n• Revenue reserves come from trading profits and can be distributed as dividends (general reserve, retained profits).\n• Capital reserves cannot be distributed as cash dividends: share premium, revaluation reserve, capital redemption reserve.\n\nToday's terms: under IFRS 9 the provision for doubtful debts is replaced by an \"allowance for expected credit losses\" (impairment of trade receivables), and debtors are called \"trade receivables\". JAMB still uses the older terms.\n\nCommon traps:\n• Charging the whole new provision to the P&L instead of only the increase.\n• Calculating the provision before writing off the year's bad debts.\n• Treating a provision as a reserve; a provision is charged before net profit, a reserve is set aside after it.\n• Calculating the discount provision on gross debtors instead of debtors less the doubtful debts provision."},{"id":"control-accounts","title":"Control accounts and self-balancing ledgers","body":"A control (total) account summarises all the transactions posted to the individual accounts in one ledger, using totals from the books of original entry. Its balance should equal the total of the individual balances in that ledger.\n\nPurposes: to check the arithmetical accuracy of a ledger, to locate errors quickly (which ledger), to give quick totals of debtors and creditors for the final accounts, and to help prevent fraud when kept by someone other than the ledger clerks.\n\nSales ledger control account (debtors control):\nDebit side: balance b/d, credit sales (sales day book), dishonoured cheques, interest charged on overdue accounts, refunds to customers, credit balances c/d.\nCredit side: cash and cheques received (cash book), discount allowed, returns inwards (returns inwards book), bad debts written off (journal), contra (set-off) with the purchases ledger, balance c/d.\n\nPurchases ledger control account (creditors control):\nDebit side: cash and cheques paid, discount received, returns outwards, contra (set-off), balance c/d.\nCredit side: balance b/d, credit purchases (purchases day book), interest charged by suppliers.\n\nNot entered in control accounts: cash sales and cash purchases, trade discount, and the provision for doubtful debts (it is not entered in the debtors' personal accounts).\n\nWorked example (sales ledger control):\nOpening debtors ₦50,000; credit sales ₦300,000; dishonoured cheque ₦3,000; cash received ₦260,000; discount allowed ₦6,000; returns inwards ₦9,000; bad debts written off ₦4,000.\nDebits = ₦50,000 + ₦300,000 + ₦3,000 = ₦353,000\nCredits = ₦260,000 + ₦6,000 + ₦9,000 + ₦4,000 = ₦279,000\nClosing balance (debit) = ₦353,000 − ₦279,000 = ₦74,000\n\nContra (set-off): when a customer is also a supplier, the amounts are set off. Dr Purchases ledger control, Cr Sales ledger control.\n\nSelf-balancing ledgers: each ledger contains its own control account (sales ledger adjustment account, general ledger adjustment account) so that each ledger can produce its own trial balance.\n\nControl accounts may have balances on both sides: a few debtors may have credit balances (overpaid), shown separately.\n\nCommon traps:\n• Putting cash sales in the sales ledger control account; only credit transactions with debtors go in.\n• Entering the provision for doubtful debts in the control account.\n• Putting discount received in the sales ledger control account; it belongs to the purchases ledger.\n• Placing the contra on the wrong side: it reduces both debtors (credit SLCA) and creditors (debit PLCA)."},{"id":"incomplete-records","title":"Incomplete records and single entry","body":"Many small traders in Nigeria do not keep full double-entry books. Their records are incomplete (single entry): usually a cash book, lists of debtors and creditors, and some invoices. The accountant must work out profit and prepare final accounts from what exists.\n\nMethod 1: Statement of affairs (capital comparison). A statement of affairs is like a balance sheet drawn up from the available information:\nCapital = Assets − Liabilities\nPrepare one at the start and one at the end of the year. Then:\nNet profit = Closing capital − Opening capital + Drawings − Capital introduced\n(A negative result is a loss.)\n\nWorked example:\nStart of year: assets ₦450,000; liabilities ₦70,000; opening capital = ₦380,000.\nEnd of year: assets ₦620,000; liabilities ₦90,000; closing capital = ₦530,000.\nDuring the year the owner took ₦60,000 for personal use and brought in a further ₦40,000.\nNet profit = ₦530,000 − ₦380,000 + ₦60,000 − ₦40,000 = ₦170,000\nDrawings are added back because they reduced capital without being a loss; new capital is deducted because it raised capital without being a profit.\n\nMethod 2: Conversion to double entry (preparing full final accounts). Reconstruct the missing figures with \"total\" accounts:\n• Total debtors account: Credit sales = Closing debtors + Cash received from debtors + Discounts allowed + Bad debts − Opening debtors.\n• Total creditors account: Credit purchases = Closing creditors + Cash paid to creditors + Discounts received − Opening creditors.\n• Total sales = Cash sales + Credit sales.\n• Expense accounts: Expense for the year = Paid + Closing accrual − Opening accrual − Closing prepayment + Opening prepayment.\n• A cash and bank summary finds missing figures such as drawings or cash sales.\n\nMark-up and margin (used to find missing sales, stock or purchases):\nMark-up = Gross profit ÷ Cost of sales; Margin = Gross profit ÷ Sales.\nMark-up 25% (¼) is the same as a margin of 20% (1/5): add the top to the bottom.\nExample: cost of sales ₦400,000 with a mark-up of 25% gives gross profit ₦100,000 and sales ₦500,000; ₦100,000 ÷ ₦500,000 = 20% margin.\nStock lost by fire or theft: Estimated closing stock = Opening stock + Purchases − Cost of sales (from sales and the margin); compare with stock actually left.\n\nWeaknesses of single entry: no trial balance check, fraud and errors are hard to detect, profit can be found only in total (not by item), and it does not meet the needs of tax authorities and lenders.\n\nCommon traps:\n• Subtracting drawings instead of adding them back when finding profit from capital changes.\n• Using cash received from debtors as total sales; credit sales must be reconstructed.\n• Mixing mark-up and margin: a 25% mark-up is not a 25% margin.\n• Forgetting opening accruals and prepayments when finding an expense."},{"id":"stock-valuation","title":"Stock (inventory) valuation","body":"Closing stock affects both the trading account (it reduces cost of goods sold) and the balance sheet (a current asset). If closing stock is overstated, gross profit and net profit are overstated by the same amount, and next year's profit is understated.\n\nBasic rule (prudence): stock is valued at the lower of cost and net realisable value (NRV), item by item.\nNRV = Expected selling price − Costs to complete and sell\nCost includes purchase price, import duty and carriage inwards, but not selling costs.\n\nMethods of pricing issues when identical items are bought at different prices:\n• FIFO (first in, first out): issues come from the oldest stock; closing stock is at the latest prices.\n• LIFO (last in, first out): issues come from the latest purchases; closing stock is at the oldest prices.\n• Weighted average cost (AVCO): issues and stock are at the average cost; in the perpetual (continuous) method a new average is worked out after each purchase.\nOthers: simple average, standard cost, specific identification (for high-value unique items).\n\nWorked example (perpetual records):\n1 Jan opening stock 100 units at ₦50 (₦5,000)\n5 Jan bought 200 units at ₦65 (₦13,000)\n10 Jan sold 250 units\n20 Jan bought 100 units at ₦70 (₦7,000)\nClosing stock = 100 + 200 − 250 + 100 = 150 units.\nFIFO: the 250 sold are the 100 at ₦50 and 150 at ₦65. Left: 50 at ₦65 + 100 at ₦70 = ₦3,250 + ₦7,000 = ₦10,250.\nLIFO: the 250 sold are the 200 at ₦65 and 50 at ₦50. Left: 50 at ₦50 + 100 at ₦70 = ₦2,500 + ₦7,000 = ₦9,500.\nAVCO: after 5 Jan, (₦5,000 + ₦13,000) ÷ 300 = ₦60 a unit. Sold 250 at ₦60 = ₦15,000; left 50 at ₦60 = ₦3,000. Add ₦7,000: closing stock 150 units = ₦10,000.\nWith rising prices: FIFO gives the highest closing stock and profit (₦10,250), LIFO the lowest (₦9,500), AVCO in between (₦10,000).\n\nStocktaking after the year end: adjust the count back to the balance sheet date (add goods sold since, deduct goods received since; sales are adjusted at cost).\n\nToday's position: IFRS (IAS 2 \"Inventories\") calls stock \"inventory\", requires the lower of cost and NRV, and does NOT allow LIFO; FIFO and weighted average are allowed. JAMB still tests LIFO calculations.\n\nCommon traps:\n• Valuing stock at selling price; it is the lower of cost and NRV.\n• Swapping FIFO and LIFO: FIFO leaves the NEWEST prices in closing stock.\n• Forgetting that overstating closing stock overstates profit.\n• Including selling costs (carriage outwards) in the cost of stock."},{"id":"manufacturing","title":"Manufacturing accounts","body":"A manufacturer makes the goods it sells, so it prepares a manufacturing account before the trading account to find the cost of the goods produced.\n\nClassification of costs:\n• Direct costs can be traced to each unit: direct materials (raw materials), direct labour (wages of machine operators), direct expenses (royalties, hire of special machines).\n• Indirect costs (factory overheads): factory rent and rates, factory power, indirect wages (supervisors, cleaners), depreciation of plant, factory insurance.\n• Office and selling costs go to the profit and loss account, not the manufacturing account.\n\nLayout:\nRaw materials consumed = Opening stock of raw materials + Purchases of raw materials + Carriage inwards on raw materials − Returns − Closing stock of raw materials\nPrime cost = Direct materials consumed + Direct labour + Direct expenses\nFactory cost = Prime cost + Factory overheads\nProduction cost (cost of goods manufactured) = Factory cost + Opening work in progress − Closing work in progress\n\nWorked example:\nOpening raw materials ₦40,000; purchases ₦300,000; carriage on raw materials ₦10,000; closing raw materials ₦50,000.\nRaw materials consumed = ₦40,000 + ₦300,000 + ₦10,000 − ₦50,000 = ₦300,000\nDirect labour ₦180,000; royalties ₦20,000.\nPrime cost = ₦300,000 + ₦180,000 + ₦20,000 = ₦500,000\nFactory overheads: indirect wages ₦60,000 + factory rent ₦40,000 + depreciation of plant ₦30,000 = ₦130,000\nFactory cost = ₦500,000 + ₦130,000 = ₦630,000\nOpening work in progress ₦25,000; closing work in progress ₦35,000.\nProduction cost = ₦630,000 + ₦25,000 − ₦35,000 = ₦620,000\n\nThe production cost is transferred to the trading account in place of purchases:\nCost of goods sold = Opening finished goods + Production cost (+ any finished goods bought) − Closing finished goods\n\nManufacturing profit: some firms transfer goods to the trading account at market value (or cost plus a percentage) so that the factory's efficiency can be judged. At 10% on cost: ₦620,000 × 10% = ₦62,000, so the transfer is ₦682,000. The ₦62,000 profit is added to net profit in the profit and loss account. A provision for unrealised profit is made on the profit element in closing finished goods, so that stock is still shown at cost.\n\nWhere an expense is shared (rent, insurance), apportion it, e.g. ¾ factory and ¼ office.\n\nCommon traps:\n• Putting office salaries or carriage outwards in the manufacturing account.\n• Treating work in progress like raw materials: WIP is adjusted after factory overheads, not in materials consumed.\n• Mixing prime cost (direct costs only) with factory cost (prime cost plus overheads).\n• Forgetting to adjust raw materials for opening and closing stock."},{"id":"not-for-profit","title":"Not-for-profit organisations: clubs and societies","body":"Clubs, societies, churches and associations exist to serve members, not to make profit. They prepare:\n• A receipts and payments account.\n• An income and expenditure account.\n• A balance sheet (statement of financial position).\nThe \"capital\" of a club is called the accumulated fund; profit is called surplus (excess of income over expenditure) and loss is deficit.\n\nReceipts and payments account: a summary of the cash book for the year. It starts with the opening cash and bank balance, shows all receipts (debit) and all payments (credit), both capital and revenue, whatever period they relate to, and ends with the closing balance. It ignores accruals, prepayments and depreciation.\n\nIncome and expenditure account: the club's version of the profit and loss account. It contains only revenue items for the year, adjusted for accruals and prepayments, and includes depreciation. Income on the credit side, expenditure on the debit side.\n\nAccumulated fund at the start = Assets − Liabilities at the start (found from a statement of affairs).\nClosing accumulated fund = Opening accumulated fund + Surplus (or − Deficit) + Capitalised items such as life membership or legacies, if the club's rule capitalises them.\n\nSubscriptions: only the subscriptions that belong to this year are income.\nWorked example: subscriptions received in cash during the year ₦180,000. At the start: ₦10,000 in arrears (owing) and ₦8,000 paid in advance. At the end: ₦12,000 in arrears and ₦15,000 paid in advance.\nIncome = ₦180,000 − ₦10,000 + ₦12,000 + ₦8,000 − ₦15,000 = ₦175,000\n(Deduct last year's arrears received; add this year's arrears; add last year's advance, which belongs to this year; deduct next year's advance.)\nSubscriptions in arrears at the end are a current asset; in advance, a current liability.\n\nBar, canteen or other trading activities: prepare a separate bar trading account; only the bar profit (or loss) goes into the income and expenditure account.\n\nOther items:\n• Donations and entrance fees: income unless the club's rules say otherwise.\n• Life membership fees: often credited to a life membership fund and released to income over a number of years.\n• Purchase of equipment: in receipts and payments; in income and expenditure only as depreciation.\n\nCommon traps:\n• Treating the receipts and payments account as showing surplus; it shows only the cash balance.\n• Including capital items (equipment bought) in the income and expenditure account.\n• Using cash received for subscriptions as income without adjusting for arrears and advances.\n• Calling a club's capital \"capital\"; it is the accumulated fund."},{"id":"partnership","title":"Partnership accounts","body":"A partnership is a relationship between persons carrying on business in common with a view to profit. In Nigeria a business partnership normally has 2 to 20 partners (CAMA 2020 requires larger associations to register as companies; certain professional firms are exempt). Partners have unlimited liability (except limited partners and LLPs registered under CAMA 2020).\n\nPartnership agreement (deed): states capital, profit-sharing ratio, salaries, interest on capital and drawings. If there is no agreement, the Partnership Act 1890 (the basis of Nigerian partnership law) applies:\n• Profits and losses are shared equally.\n• No interest on capital and no salaries.\n• No interest on drawings.\n• Interest of 5% a year on loans made by a partner beyond agreed capital.\n\nCapital and current accounts: under fixed capital, the capital account stays the same; interest, salaries, share of profit and drawings go to the current account. Under fluctuating capital, everything goes to the capital account.\n\nAppropriation account:\nNet profit\n+ Interest on drawings\n− Interest on capital\n− Partners' salaries\n= Residual profit, shared in the profit-sharing ratio.\n\nWorked example: A and B share profits 3:2. Net profit ₦300,000. Capitals A ₦500,000, B ₦300,000; interest on capital 10%. B's salary ₦40,000. Interest on drawings A ₦4,000, B ₦6,000.\nInterest on capital: A ₦50,000; B ₦30,000.\nResidual = ₦300,000 + ₦10,000 − ₦80,000 − ₦40,000 = ₦190,000\nA: 3/5 × ₦190,000 = ₦114,000; B: 2/5 × ₦190,000 = ₦76,000.\n\nGoodwill: the value of a firm's reputation and customers above its net assets. It is valued (average profits × years' purchase, super-profits, etc.) when a partner is admitted, retires or dies, or the ratio changes.\nExample: goodwill valued at ₦120,000 on admitting C; A and B share 3:2.\nDr Goodwill ₦120,000; Cr A ₦72,000; Cr B ₦48,000.\nIf goodwill is not kept in the books, write it off in the new ratio (Dr partners' capital accounts, Cr Goodwill).\n\nAdmission and retirement also need a revaluation account: increases in asset values are credited, decreases debited, and the profit or loss is shared among the OLD partners in the OLD ratio.\n\nDissolution: a realisation account collects the assets at book value, the sale proceeds and the costs; the profit or loss on realisation goes to partners in their profit-sharing ratio; liabilities are paid, and partners' capital accounts are settled in cash. If a partner cannot pay a deficiency, the rule in Garner v Murray (1904) makes the solvent partners bear it in the ratio of their last agreed capitals.\n\nCommon traps:\n• Treating partners' salaries and interest on capital as expenses; they are appropriations.\n• Deducting interest on drawings; it is added to profit (charged to partners).\n• Sharing revaluation profit in the new ratio; it belongs to the old partners in the old ratio.\n• Assuming partners share profit in capital ratio when there is no agreement; they share equally."},{"id":"companies","title":"Company accounts: shares, debentures and final accounts","body":"A limited liability company is a separate legal person, registered with the Corporate Affairs Commission under the Companies and Allied Matters Act (CAMA) 2020, which replaced CAMA 1990. Shareholders' liability is limited to the amount unpaid on their shares. A private company (Ltd) cannot offer shares to the public; a public company (Plc) can. CAMA 2020 allows a private company to have a single member, and it replaced \"authorised share capital\" with a minimum issued share capital (₦100,000 for a private company, ₦2,000,000 for a public company).\n\nTypes of shares:\n• Ordinary shares (equity): carry votes; dividends vary with profit; paid last in a winding up.\n• Preference shares: fixed rate of dividend, paid before ordinary dividends; usually no votes. Cumulative (arrears carried forward), non-cumulative, participating, redeemable.\nTerms: nominal (par) value; issued capital; called-up capital; paid-up capital; calls in arrears.\n\nIssue of shares: money is received in stages (application, allotment, calls).\nIssue at a premium: the excess over nominal value goes to the share premium account (a capital reserve).\nExample: 200,000 ordinary shares of ₦1 each issued at ₦1.25, fully paid.\nDr Bank ₦250,000; Cr Ordinary share capital ₦200,000; Cr Share premium ₦50,000.\n\nForfeiture: if a shareholder fails to pay a call, the shares may be forfeited.\nExample: 1,000 shares of ₦1, ₦0.60 paid, final call of ₦0.40 unpaid.\nDr Share capital ₦1,000; Cr Call account ₦400; Cr Forfeited shares ₦600.\nReissued at ₦0.80 fully paid: Dr Bank ₦800, Dr Forfeited shares ₦200, Cr Share capital ₦1,000. The ₦400 left on forfeited shares (₦600 − ₦200) is transferred to share premium.\n\nDebentures: long-term loans to the company, usually secured, at a fixed rate of interest. Debenture holders are creditors, not owners. Debenture interest is an expense charged in the profit and loss account whether or not there is a profit; dividends are paid only out of profits.\n\nCompany profit and loss appropriation account:\nNet profit before tax\n− Taxation\n= Profit after tax\n− Dividends (preference, then ordinary)\n− Transfer to general reserve\n= Retained profit for the year (+ retained profit brought forward)\nExample: 10% preference shares of ₦500,000 receive ₦50,000 dividend.\n\nBalance sheet: share capital and reserves (share premium, revaluation reserve, general reserve, retained profit) make up shareholders' funds (equity). Debentures and long-term loans are non-current liabilities; taxation payable is a current liability.\n\nPublished accounts (CAMA 2020 and IFRS): statement of financial position, statement of profit or loss and other comprehensive income, statement of changes in equity, statement of cash flows, notes, directors' report and auditors' report. Under IAS 10, dividends proposed after the year end are not a liability; they are disclosed in a note (older JAMB questions show \"proposed dividend\" as a current liability).\n\nCommon traps:\n• Treating debentures as part of share capital.\n• Treating debenture interest as an appropriation; it is an expense.\n• Crediting share premium to the profit and loss account; it is a capital reserve.\n• Paying ordinary dividend before the preference dividend."},{"id":"special-accounts","title":"Departmental, branch, joint venture, consignment, hire purchase and contract accounts","body":"Departmental accounts: one business with several departments prepares a columnar trading and profit and loss account to show each department's results. Shared expenses are apportioned on a fair basis: rent and rates by floor area, lighting by number of points or floor area, wages by number of staff, advertising and discounts by sales, depreciation by asset value. Goods moved between departments are charged at an agreed transfer price.\n\nBranch accounts: goods sent from head office to a branch are recorded in a goods sent to branch account and branch stock account, at cost or at selling (invoice) price. If at invoice price, a branch stock adjustment (mark-up) account removes the unrealised profit, so that branch stock is shown at cost.\n\nJoint venture: a short-term partnership of two or more people for one project. Each venturer records his own part in a \"joint venture with X\" account; at the end a memorandum joint venture account combines all items to find the profit, which is shared in the agreed ratio, and the balance is settled in cash.\n\nConsignment: the consignor sends goods to a consignee (agent) who sells them for a commission; ownership stays with the consignor until sale. The consignee sends an account sales. Unsold stock is valued at cost plus a proportion of the consignor's expenses incurred in getting the goods to the consignee (not selling costs).\nWorked example: 100 bags of rice at ₦10,000 each (₦1,000,000) sent; consignor pays freight ₦50,000. The consignee sells 80 bags at ₦15,000 (₦1,200,000), pays selling expenses ₦20,000 and charges 5% commission (₦60,000).\nCost per bag = (₦1,000,000 + ₦50,000) ÷ 100 = ₦10,500\nUnsold stock = 20 × ₦10,500 = ₦210,000\nProfit = ₦1,200,000 − (80 × ₦10,500) − ₦20,000 − ₦60,000 = ₦1,200,000 − ₦840,000 − ₦80,000 = ₦280,000\nA del credere commission is an extra commission for which the consignee bears bad debts.\n\nHire purchase: the buyer takes the asset at once, pays a deposit and instalments, and becomes owner only when the last instalment is paid.\nHire purchase price = Cash price + Interest (finance charge)\nThe buyer records the asset at the cash price and depreciates it; interest is an expense of each year. The seller can repossess the goods if instalments are not paid. (Under IFRS the asset is shown as the buyer's property, plant and equipment, with the unpaid cash price as a liability.)\n\nContract accounts: for long-term contracts such as building roads. Costs are collected in a contract account; the architect's certificate states work certified; the client keeps a retention (for example 10%) until the work is proven.\nNotional profit = Work certified − Cost of work certified\nTraditional rule for incomplete contracts: Profit taken = ⅔ × Notional profit × Cash received ÷ Work certified. Any foreseeable loss is taken in full (prudence). Today IFRS 15 recognises revenue as performance obligations are satisfied.\n\nCommon traps:\n• Apportioning rent by sales instead of floor area.\n• Including the consignee's selling expenses in the value of unsold stock.\n• Recording a hire purchase asset at the total HP price instead of the cash price.\n• Treating work certified as profit; profit is work certified less its cost, reduced for prudence."},{"id":"public-sector","title":"Public sector (government) accounting","body":"Public sector accounting records and reports the receipts and spending of government and its agencies. Its aim is accountability and stewardship, not profit.\n\nDifferences from private sector accounting: no profit motive; spending is controlled by budgets passed into law; traditionally a cash basis; fund accounting; no capital owned by \"owners\".\n\nBasis: Nigeria traditionally used the cash basis. It adopted International Public Sector Accounting Standards (IPSAS): IPSAS cash basis from 2014 and IPSAS accrual basis from 2016 at federal level.\n\nMain government funds (sections are of the 1999 Constitution):\n• Consolidated Revenue Fund (section 80): all federal revenue is paid into it, and money can be withdrawn only by an Appropriation Act or as the Constitution allows.\n• Contingencies Fund (section 83): for urgent, unforeseen spending, later approved by supplementary appropriation.\n• Development Fund: capital projects.\n• Federation Account (section 162): revenue shared among the federal, state and local governments.\n• Special and trust funds, for example the Ecological Fund.\n\nBudget process: estimates are prepared by ministries, the Appropriation Bill is presented by the President to the National Assembly, passed into an Appropriation Act, and spending is then released. Recurrent expenditure covers salaries and running costs; capital expenditure covers projects. A supplementary budget covers extra needs.\nAuthority to spend: the general warrant (recurrent), the capital warrant, the supplementary warrant, and the Authority to Incur Expenditure (AIE) issued to officers. A vote book records each commitment and payment against its approved vote to prevent overspending.\n\nKey officers and bodies:\n• Minister of Finance: overall financial policy.\n• Accountant-General of the Federation (OAGF): the federal treasury; keeps the government's accounts, makes payments and prepares the annual financial statements.\n• Auditor-General for the Federation (section 85): audits public accounts and reports to the National Assembly, where the Public Accounts Committee examines the report.\n• Accounting officer: the Permanent Secretary (or chief executive) of a ministry or agency, answerable for its spending.\n• Financial Regulations and the Fiscal Responsibility Act 2007 control spending; the Public Procurement Act 2007 created the Bureau of Public Procurement.\n• Treasury Single Account (TSA): all federal government receipts are paid into one account at the Central Bank of Nigeria, fully enforced from 2015.\n\nPublic sector bodies: ministries, extra-ministerial departments, parastatals and government-owned companies, and local governments.\n\nCommon traps:\n• Confusing the Accountant-General (treasury and payments) with the Auditor-General (independent audit).\n• Thinking government accounts aim to show profit.\n• Mixing the Consolidated Revenue Fund with the Contingencies Fund.\n• Thinking the budget allows spending by itself; spending needs warrants and AIEs."},{"id":"interpretation","title":"Interpretation of accounts: ratios, working capital and cash flow","body":"Ratios turn figures into comparisons, between years, firms or against targets. JAMB tests their formulas and simple calculations.\n\nProfitability:\nGross profit margin = Gross profit ÷ Sales × 100\nMark-up = Gross profit ÷ Cost of sales × 100\nNet profit margin = Net profit ÷ Sales × 100\nROCE = Net profit before interest and tax ÷ Capital employed × 100\nCapital employed = Share capital + Reserves + Long-term liabilities (= Total assets − Current liabilities)\n\nLiquidity:\nWorking capital = Current assets − Current liabilities\nCurrent ratio = Current assets ÷ Current liabilities (about 2:1 traditionally comfortable)\nAcid-test (quick) ratio = (Current assets − Stock) ÷ Current liabilities (about 1:1)\n\nActivity (efficiency):\nStock turnover = Cost of goods sold ÷ Average stock\nAverage stock = (Opening stock + Closing stock) ÷ 2\nDebtors collection period = Debtors ÷ Credit sales × 365 days\nCreditors payment period = Creditors ÷ Credit purchases × 365 days\n\nGearing and investors:\nGearing = Long-term loans (debentures + preference shares) ÷ Capital employed × 100; high gearing means more risk for ordinary shareholders.\nEarnings per share = Profit after tax and preference dividend ÷ Number of ordinary shares\nDividend cover = Profit available to ordinary shareholders ÷ Ordinary dividend\nPrice/earnings ratio = Market price per share ÷ Earnings per share\n\nWorked example: sales (all credit) ₦800,000; cost of goods sold ₦600,000; opening stock ₦70,000; closing stock ₦80,000; current assets ₦240,000 (including stock ₦80,000 and debtors ₦80,000); current liabilities ₦120,000.\nGross profit = ₦800,000 − ₦600,000 = ₦200,000; margin = 200,000 ÷ 800,000 × 100 = 25%\nMark-up = 200,000 ÷ 600,000 × 100 = 33⅓%\nAverage stock = (₦70,000 + ₦80,000) ÷ 2 = ₦75,000; stock turnover = 600,000 ÷ 75,000 = 8 times\nCurrent ratio = 240,000 ÷ 120,000 = 2 : 1\nAcid-test ratio = (240,000 − 80,000) ÷ 120,000 = 1.33 : 1\nWorking capital = ₦240,000 − ₦120,000 = ₦120,000\nDebtors collection period = 80,000 ÷ 800,000 × 365 = 36.5 days\n\nCash flow statement (IAS 7): shows where cash came from and went, under three headings:\n• Operating activities: net profit adjusted for non-cash items (add depreciation, loss on disposal) and working capital changes (an increase in stock or debtors reduces cash; an increase in creditors increases it).\n• Investing activities: buying and selling fixed assets and investments.\n• Financing activities: issuing shares, raising or repaying loans, paying dividends.\nOlder texts used a \"funds flow statement\" (sources and applications of funds).\n\nLimitations of ratios: based on historical figures, affected by different accounting policies and inflation, and they show symptoms, not causes.\n\nCommon traps:\n• Using sales instead of cost of goods sold for stock turnover.\n• Confusing margin (on sales) with mark-up (on cost).\n• Leaving stock in the acid-test ratio.\n• Treating depreciation as a cash outflow in the cash flow statement; it is added back."}];const sel=document.getElementById('sel');lessons.forEach((x,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+x.title;sel.appendChild(o)});function show(){let l=lessons[+sel.value||0];document.getElementById('title').textContent=l.title;document.getElementById('body').textContent=l.body}sel.onchange=show;show();</script></body></html>
