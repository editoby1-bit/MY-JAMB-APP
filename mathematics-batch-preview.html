<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122944"><title>Mathematics — Redone Lessons Only</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#183047;font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#122944;color:white;padding:20px 18px}header .inner,main{max-width:900px;margin:auto}h1{font-size:1.35rem;margin:0 0 4px}header p{margin:0;color:#d5e4ef;font-size:.92rem}.status{display:inline-block;background:#dff6e7;color:#155a39;border-radius:20px;padding:4px 11px;font-size:.82rem;font-weight:700;margin:18px 0 10px}main{padding:0 15px 35px}label{display:block;font-weight:750;margin:10px 0 6px}select{width:100%;padding:13px;border:2px solid #9db5ca;border-radius:11px;background:white;color:#142d46;font:inherit}.note{font-size:.87rem;color:#496178;margin:9px 0 17px}.paper{background:white;border-radius:13px;padding:20px 17px;box-shadow:0 2px 14px #18304712}.paper h2{font-size:1.28rem;line-height:1.3;margin:0 0 13px}.body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.96rem;line-height:1.72}.body::first-line{font-weight:800}.diagram{margin-top:22px;border-top:1px solid #dce5ee;padding-top:14px}.diagram svg{max-width:100%;height:auto;display:block}.diagram h3{font-size:1rem}.error{color:#a12525}footer{text-align:center;padding:20px;font-size:.8rem;color:#62758a}@media(min-width:700px){.paper{padding:32px}.body{font-size:1rem}}
</style></head><body><header><div class="inner"><h1>Mathematics · Deep Rewrite</h1><p>Only lessons completed in the new batches appear here.</p></div></header>
<main><span class="status">Batch 1 · 3 lessons completed</span><label for="lesson">Choose a completed lesson</label><select id="lesson"><option value="number-bases">1. Number Bases</option><option value="fractions-decimals">2. Fractions, Decimals and Approximation</option><option value="commercial">3. Commercial Arithmetic</option></select><p class="note">The remaining 26 topics are intentionally absent. This page is a preview; the live app is unchanged.</p><article class="paper"><h2 id="title">Loading lesson…</h2><div id="body" class="body"></div><div id="diagram" class="diagram"></div></article></main><footer>My JAMB App · Mathematics batch preview</footer>
<script src="./key-points-review-mathematics.js?v=deep-batch1-three-only-20261107-c"></script>
<script>
(function(){
'use strict';
const allowed=['number-bases','fractions-decimals','commercial'];
const select=document.getElementById('lesson'),title=document.getElementById('title'),body=document.getElementById('body'),diagram=document.getElementById('diagram');
function render(){
 const id=select.value;
 if(!allowed.includes(id)){title.textContent='Unavailable';body.textContent='Only completed lessons can be opened.';diagram.replaceChildren();return;}
 const lesson=(window.MATHEMATICS_REVIEW_LESSONS||[]).find(x=>x.id===id);
 if(!lesson){title.textContent='Lesson could not load';body.textContent='Please refresh the page to load the latest Mathematics lessons.';body.className='body error';diagram.replaceChildren();return;}
 title.textContent=lesson.new.title;
 body.textContent=lesson.new.body;
 const svg=(window.MATHEMATICS_REVIEW_DIAGRAMS||{})[id];
 diagram.innerHTML=svg||'';
 diagram.style.display=svg?'block':'none';
}
select.addEventListener('change',render);
render();
})();
</script></body></html>
